<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Health Tracker · Dashboard</title>
  <link rel="stylesheet" href="./style.css" />
  <!-- html2pdf library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <style>
    /* existing styles (unchanged) – only the report section is enhanced */
    .sv-chart { display: block; width: 100%; height: 100%; }
    .sv-chart-wrap { touch-action: pan-y; user-select: none; }
    .chart-tooltip { 
      position: absolute; 
      background: rgba(0,0,0,0.8); 
      color: white; 
      padding: 8px 12px; 
      border-radius: 8px; 
      font-size: 12px; 
      pointer-events: none; 
      opacity: 0; 
      transition: opacity 0.2s; 
      border: 1px solid rgba(255,255,255,0.2);
      backdrop-filter: blur(4px);
      z-index: 100;
    }
    .chart-tooltip.show { opacity: 1; }
    
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 600;
      margin-left: 8px;
      vertical-align: middle;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .status-badge.normal {
      background-color: rgba(46, 204, 113, 0.15);
      color: #2ecc71;
      border-color: rgba(46, 204, 113, 0.3);
    }
    .status-badge.elevated {
      background-color: rgba(241, 196, 15, 0.15);
      color: #f1c40f;
      border-color: rgba(241, 196, 15, 0.3);
    }
    .status-badge.prediabetes {
      background-color: rgba(243, 156, 18, 0.15);
      color: #f39c12;
      border-color: rgba(243, 156, 18, 0.3);
    }
    .status-badge.high {
      background-color: rgba(231, 76, 60, 0.15);
      color: #e74c3c;
      border-color: rgba(231, 76, 60, 0.3);
    }
    .status-badge.stage1 {
      background-color: rgba(243, 156, 18, 0.15);
      color: #f39c12;
      border-color: rgba(243, 156, 18, 0.3);
    }
    .status-badge.stage2 {
      background-color: rgba(231, 76, 60, 0.15);
      color: #e74c3c;
      border-color: rgba(231, 76, 60, 0.3);
    }
    .status-badge.crisis {
      background-color: rgba(155, 89, 182, 0.15);
      color: #9b59b6;
      border-color: rgba(155, 89, 182, 0.3);
    }
    .trend-up {
      color: #e74c3c;
      font-size: 12px;
      margin-right: 2px;
    }
    .trend-down {
      color: #2ecc71;
      font-size: 12px;
      margin-right: 2px;
    }

    .appbar-actions { gap: 6px; }
    .chip { padding: 6px 10px; font-size: 12px; }
    .icon-btn { padding: 6px 10px; }

    /* Hide Google Translate junk */
    .goog-te-banner-frame.skiptranslate { display: none !important; }
    body { top: 0 !important; }
    .goog-tooltip { display: none !important; }
    .goog-text-highlight { background-color: transparent !important; border: none !important; box-shadow: none !important; }
    iframe.goog-te-banner-frame { display: none !important; }
    div.skiptranslate { display: none !important; }

    /* ========== Report Tab Design ========== */
    .report-header {
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 2px solid rgba(255,255,255,0.2);
    }
    .report-header h1 {
      font-size: 28px;
      font-weight: 600;
      margin: 0 0 8px 0;
      color: white;
    }
    .report-meta {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      color: #aaa;
    }
    .report-section {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .report-section h2 {
      margin: 0 0 20px 0;
      font-size: 20px;
      font-weight: 600;
      color: #ddd;
      border-left: 4px solid #4c7dff;
      padding-left: 12px;
    }
    .report-row {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px dashed rgba(255,255,255,0.1);
    }
    .report-row:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .report-label {
      font-weight: 600;
      font-size: 16px;
      color: #ccc;
      margin-bottom: 6px;
    }
    .report-value {
      font-size: 24px;
      font-weight: 700;
      margin-right: 8px;
    }
    .report-suggestion {
      font-size: 13px;
      color: #aaa;
      margin-top: 8px;
      line-height: 1.5;
      background: rgba(0,0,0,0.2);
      padding: 10px 12px;
      border-radius: 10px;
    }

    /* ========== COMPACT STYLES FOR PRINT & PDF (single page) ========== */
    @media print {
      @page {
        size: A4;
        margin: 0.8cm; /* slightly smaller margins */
      }
      body * { visibility: hidden; }
      #tab-report, #tab-report * { visibility: visible; }
      #tab-report {
        position: static;
        background: white;
        color: black;
        padding: 0;
        width: 100%;
        font-size: 10pt;
        line-height: 1.2;
      }
      .appbar, .tabs, .toast, .card-head, .footer, .pager { display: none !important; }

      /* Compact report header */
      .report-header {
        margin-bottom: 8px;
        padding-bottom: 4px;
        border-bottom: 1px solid #ccc;
      }
      .report-header h1 {
        font-size: 18pt;
        color: black;
        margin: 0 0 2px;
      }
      .report-header div {
        font-size: 9pt;
        color: #333;
      }

      /* Sections */
      .report-section {
        background: #f9f9f9;
        border: 1px solid #ddd;
        padding: 6px 8px;
        margin-bottom: 8px;
        page-break-inside: avoid;
      }
      .report-section h2 {
        font-size: 12pt;
        margin: 0 0 6px;
        border-left: 3px solid #2c3e50;
        padding-left: 5px;
        color: #111;
      }
      .report-row {
        margin-bottom: 6px;
        padding-bottom: 4px;
        border-bottom: 1px dashed #ddd;
        page-break-inside: avoid;
      }
      .report-row:last-child { border-bottom: none; }
      .report-label {
        font-size: 9pt;
        font-weight: 600;
        color: #222;
        margin-bottom: 2px;
      }
      .report-value {
        font-size: 11pt;
        font-weight: 700;
        color: #000;
      }
      .status-badge {
        font-size: 7pt;
        padding: 1px 4px;
        border: 1px solid currentColor !important;
        background: transparent !important;
        color: black !important;
      }
      .report-suggestion {
        font-size: 8pt;
        padding: 3px 5px;
        margin-top: 3px;
        background: #f0f0f0;
        color: #222;
        border: 1px solid #ccc;
      }
      .trend-up, .trend-down {
        font-size: 9pt;
        color: black;
      }
    }

    /* ========== EXCLUSIVE PDF STYLES (for Save/Share) ========== */
    .pdf-report {
      background: white;
      color: black;
      font-size: 10pt;
      line-height: 1.2;
    }
    .pdf-report .report-header {
      margin-bottom: 8px;
      padding-bottom: 4px;
      border-bottom: 1px solid #ccc;
    }
    .pdf-report .report-header h1 {
      font-size: 18pt;
      margin: 0 0 2px;
      color: black;
    }
    .pdf-report .report-header div {
      font-size: 9pt;
      color: #333;
    }
    .pdf-report .report-section {
      background: #f9f9f9;
      border: 1px solid #ddd;
      padding: 6px 8px;
      margin-bottom: 8px;
      page-break-inside: avoid;
    }
    .pdf-report .report-section h2 {
      font-size: 12pt;
      margin: 0 0 6px;
      border-left: 3px solid #2c3e50;
      padding-left: 5px;
      color: #111;
    }
    .pdf-report .report-row {
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 1px dashed #ddd;
    }
    .pdf-report .report-row:last-child { border-bottom: none; }
    .pdf-report .report-label {
      font-size: 9pt;
      font-weight: 600;
      color: #222;
    }
    .pdf-report .report-value {
      font-size: 11pt;
      font-weight: 700;
      color: #000;
    }
    .pdf-report .status-badge {
      font-size: 7pt;
      padding: 1px 4px;
      border: 1px solid currentColor !important;
      background: transparent !important;
      color: black !important;
    }
    .pdf-report .report-suggestion {
      font-size: 8pt;
      padding: 3px 5px;
      margin-top: 3px;
      background: #f0f0f0;
      color: #222;
      border: 1px solid #ccc;
    }
    .pdf-report .trend-up, .pdf-report .trend-down {
      font-size: 9pt;
      color: black;
    }

    /* Tabs, store, etc. (unchanged) */
    .tabs { gap: 4px; }
    .tab { padding: 10px 16px; font-size: 14px; }
    .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 16px; padding: 16px; }
    .category-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap: 20px; padding: 16px; }
    .category-card { background: rgba(255,255,255,0.07); border-radius: 16px; padding: 20px 12px; text-align: center; transition: transform 0.2s; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(4px); cursor: pointer; }
    .category-card:hover { transform: translateY(-4px); background: rgba(255,255,255,0.12); border-color: rgba(76,125,255,0.3); }
    .category-image { width: 100%; height: 120px; display: flex; align-items: center; justify-content: center; font-size: 48px; }
    .product-card { background: rgba(255,255,255,0.07); border-radius: 16px; padding: 16px 12px; text-align: center; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(4px); }
    .product-btn { background: linear-gradient(145deg,#4c7dff,#3a5fd0); border: none; color: white; padding: 8px 16px; border-radius: 40px; font-weight: 600; cursor: pointer; }

    /* Daily points */
    .daily-points { margin-top: 24px; padding: 16px; background: rgba(255,255,255,0.03); border-radius: 16px; }
    .points-container { display: flex; justify-content: space-between; gap: 8px; }
    .point-circle { width: 24px; height: 24px; border-radius: 50%; }
    .glucose-point.normal { background-color: #2ecc71; }
    .glucose-point.prediabetes { background-color: #f39c12; }
    .glucose-point.diabetes { background-color: #e74c3c; }
    .bp-point.normal { background-color: #2ecc71; }
    .bp-point.elevated { background-color: #f1c40f; }
    .bp-point.stage1 { background-color: #f39c12; }
    .bp-point.stage2 { background-color: #e74c3c; }
    .bp-point.crisis { background-color: #9b59b6; }
  </style>
</head>
<body class="app-page">
  <!-- App bar (unchanged) -->
  <header class="appbar">
    <div class="appbar-inner">
      <div class="brand">
        <img src="./images/logo.png" alt="DahniTech Solutions" class="brand-logo" />
        <div class="brand-text">
          <div class="brand-title">Health Tracker</div>
          <div class="brand-sub" id="subtitle"></div>
        </div>
      </div>
      <div class="appbar-actions">
        <button class="chip" id="whoamiChip" type="button"><span class="dot"></span><span id="whoamiText">Connected</span></button>
        <button class="icon-btn" type="button" onclick="logout()">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M10 17l1.41-1.41L8.83 13H21v-2H8.83l2.58-2.59L10 7l-7 7 7 7z"/><path d="M3 3h8v2H5v14h6v2H3V3z"/></svg>
          <span class="hide-sm">Logout</span>
        </button>
      </div>
    </div>
  </header>

  <main class="shell">
    <!-- Tabs -->
    <nav class="tabs">
      <button class="tab active" data-tab="dashboard" onclick="showTab('dashboard')">Dashboard</button>
      <button class="tab" data-tab="history" onclick="showTab('history')">History</button>
      <button class="tab" data-tab="report" onclick="showTab('report')">Report</button>
      <button class="tab" data-tab="store" onclick="showTab('store')">Store</button>
    </nav>

    <!-- Dashboard (unchanged) -->
    <section id="tab-dashboard" class="tab-panel active">[...dashboard content remains same...]</section>
    <!-- History (unchanged) -->
    <section id="tab-history" class="tab-panel">[...history content remains same...]</section>

    <!-- REPORT TAB (modified) -->
    <section id="tab-report" class="tab-panel">
      <section class="card">
        <!-- Only action buttons in card head -->
        <div class="card-head" style="display: flex; justify-content: flex-end; gap: 8px;">
          <button class="btn secondary" onclick="shareReport()">📤 Share</button>
          <button class="btn primary" onclick="printReport()">🖨️ Print</button>
          <button class="btn secondary" onclick="saveReportAsPDF()">💾 Save</button>
        </div>
        <!-- Report content populated by JS -->
        <div id="reportContent" class="report-grid"></div>
      </section>
    </section>

    <!-- Store (unchanged) -->
    <section id="tab-store" class="tab-panel">[...store content remains same...]</section>
  </main>

  <div id="toast" class="toast"></div>

  <script>
    (function() {
      "use strict";
      const $ = id => document.getElementById(id);
      function toast(msg, type='ok') {
        const t = $('toast');
        t.textContent = msg;
        t.className = `toast show ${type}`;
        clearTimeout(window.toastTimer);
        window.toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
      }
      function escapeHtml(unsafe) {
        if (unsafe == null) return '';
        return String(unsafe).replace(/[&<>"']/g, function(m) {
          if(m === '&') return '&amp;'; if(m === '<') return '&lt;'; if(m === '>') return '&gt;'; if(m === '"') return '&quot;'; return '&#039;';
        });
      }
      function getAuth() {
        return { userId: localStorage.getItem('userId')||'', name: localStorage.getItem('name')||'', email: localStorage.getItem('email')||'' };
      }
      function requireAuth() { if (!getAuth().userId) { window.location.href='./index.html'; return false; } return true; }
      window.logout = () => { ['userId','name','phone','email'].forEach(k=>localStorage.removeItem(k)); window.location.href='./index.html'; };

      window.showTab = name => {
        document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
        document.querySelector(`.tab[data-tab="${name}"]`).classList.add('active');
        $(`tab-${name}`).classList.add('active');
        if (name === 'store') renderStoreCategories();
      };

      // Form toggle (unchanged) – assume present
      window.toggleForm = (which) => { /* ... */ };

      // Global state
      let allReadings = [], currentPage = 1, PAGE_SIZE = 10;
      function parseDate(ts) { let d = new Date(ts); return isNaN(d.getTime()) ? null : d; }
      function isSameDay(d1,d2) { return d1.toDateString() === d2.toDateString(); }

      // Descriptions without emojis (to avoid print issues)
      function getGlucoseDescription(value, note) {
        const num = Number(value); if (isNaN(num)) return '';
        const nLow = String(note).toLowerCase();
        const fasting = nLow.includes('fasting');
        const post = nLow.includes('after meal') || nLow.includes('aftermeal');
        if (fasting) {
          if (num < 70) return 'Dangerous low (Hypoglycemia) - May cause dizziness, sweating, shaking, loss of consciousness.';
          if (num <= 99) return 'Normal - Healthy level for non-diabetic.';
          if (num <= 125) return 'Prediabetes - Warning sign, needs lifestyle changes.';
          return 'Diabetes - Official diagnosis if repeated.';
        } else if (post) {
          if (num < 140) return 'Normal - 2 hours after meal.';
          if (num <= 199) return 'Prediabetes - After meal.';
          return 'Likely Diabetes - After meal.';
        } else {
          if (num < 70) return 'Dangerous low (Hypoglycemia)';
          if (num <= 99) return 'Normal';
          if (num <= 125) return 'Prediabetes';
          return 'Diabetes';
        }
      }
      function getBPDescription(bpString) {
        const parts = bpString.split('/').map(Number);
        if (parts.length!==2 || isNaN(parts[0]) || isNaN(parts[1])) return '';
        const sys=parts[0], dia=parts[1];
        if (sys>=180 || dia>=120) return 'Hypertensive Crisis - Danger to brain, heart, kidneys. If severe headache, chest pain, shortness of breath → ER immediately.';
        if (sys>=140 || dia>=90) return 'Stage 2 Hypertension - Clearly high, usually needs medication + lifestyle changes.';
        if (sys>=130 || dia>=80) return 'Stage 1 Hypertension - Early high BP, may need monitoring or treatment.';
        if (sys>=120 && dia<80) return 'Elevated - Not yet hypertension, early warning. Needs lifestyle changes.';
        if (sys<120 && dia<80) return 'Normal - Healthy BP, no current risk.';
        if (sys<90 || dia<60) return 'Low Blood Pressure - If dizziness or fainting occurs, seek evaluation.';
        return '';
      }

      // Glucose status (badge, color)
      function getGlucoseStatus(value, note='') {
        const num = Number(value); if (isNaN(num)) return { badgeText:'', colorClass:'', warning:false, trend:null };
        const nLow = String(note).toLowerCase();
        const fasting = nLow.includes('fasting');
        const post = nLow.includes('after meal') || nLow.includes('aftermeal');
        let badge='', color='', warn=false, trend=null;
        if (fasting) {
          if (num<100) { badge='Normal'; color='glucose-normal'; trend='down'; }
          else if (num<=125) { badge='Prediabetes'; color='glucose-prediabetes'; }
          else { badge='High'; color='glucose-diabetes'; warn=true; trend='up'; }
        } else if (post) {
          if (num<140) { badge='Normal'; color='glucose-normal'; trend='down'; }
          else if (num<=199) { badge='Prediabetes'; color='glucose-prediabetes'; }
          else { badge='High'; color='glucose-diabetes'; warn=true; trend='up'; }
        } else {
          if (num<100) { badge='Normal'; color='glucose-normal'; trend='down'; }
          else if (num<=125) { badge='Prediabetes'; color='glucose-prediabetes'; }
          else { badge='High'; color='glucose-diabetes'; warn=true; trend='up'; }
        }
        return { badgeText:badge, colorClass:color, warning:warn, trend };
      }

      function getBPStatus(bpString) {
        // similar to before but simplified badge
        const parts = bpString.split('/').map(Number);
        if (parts.length!==2 || isNaN(parts[0])||isNaN(parts[1])) return { badgeText:'', colorClass:'', warning:false, trend:null };
        const sys=parts[0], dia=parts[1];
        let badge='', color='', warn=false, trend=null;
        if (sys>=180 || dia>=120) { badge='Crisis'; color='bp-crisis'; warn=true; trend='up'; }
        else if (sys>=140 || dia>=90) { badge='Stage 2'; color='bp-stage2'; warn=true; trend='up'; }
        else if (sys>=130 || dia>=80) { badge='Stage 1'; color='bp-stage1'; }
        else if (sys>=120 && dia<80) { badge='Elevated'; color='bp-elevated'; }
        else if (sys<120 && dia<80) { badge='Normal'; color='bp-normal'; trend='down'; }
        else { badge='Normal'; color='bp-normal'; } // fallback
        return { badgeText:badge, colorClass:color, warning:warn, trend, display:bpString, sys, dia };
      }

      // API calls (unchanged) – assume present
      window.saveGlucose = async () => { /* ... */ };
      window.saveBP = async () => { /* ... */ };

      async function loadReadings() {
        if (!requireAuth()) return [];
        const { userId } = getAuth();
        try {
          const res = await fetch(`/api/readings/${encodeURIComponent(userId)}`);
          if (!res.ok) throw new Error();
          const data = await res.json();
          allReadings = Array.isArray(data) ? data.sort((a,b)=>new Date(b.ts)-new Date(a.ts)) : [];
        } catch { toast('Failed to load readings','err'); allReadings=[]; }
        return allReadings;
      }

      // Render functions (summary, history, insights, daily points) – unchanged, assume they work.
      // For brevity, only report rendering and PDF functions are shown fully.
      // ... (all the other render functions would be here, but we skip to keep answer focused)

      // ===== Report rendering =====
      function renderReport() {
        const container = $('reportContent');
        if (!container) return;
        const { name } = getAuth();
        const userName = name ? name.split(' ')[0] : 'Guest';
        const now = new Date();
        const printDate = now.toLocaleDateString() + ' ' + now.toLocaleTimeString();

        const oneWeekAgo = new Date(now.getTime() - 7*86400000);
        const oneMonthAgo = new Date(now.getTime() - 30*86400000);
        const oneYearAgo = new Date(now.getTime() - 365*86400000);

        const week = allReadings.filter(r => parseDate(r.ts) >= oneWeekAgo);
        const month = allReadings.filter(r => parseDate(r.ts) >= oneMonthAgo);
        const year = allReadings.filter(r => parseDate(r.ts) >= oneYearAgo);

        const avgGlucose = arr => { let v = arr.filter(r=>r.type==='glucose').map(r=>Number(r.value)).filter(n=>!isNaN(n)); return v.length ? Math.round(v.reduce((a,b)=>a+b,0)/v.length) : null; };
        const avgBP = arr => {
          let bp = arr.filter(r=>r.type==='bp'), totalSys=0, totalDia=0, count=0;
          bp.forEach(r => { let p = r.value.split('/').map(Number); if(p.length===2 && !isNaN(p[0]) && !isNaN(p[1])) { totalSys+=p[0]; totalDia+=p[1]; count++; } });
          return count ? { sys: Math.round(totalSys/count), dia: Math.round(totalDia/count) } : null;
        };

        const wGluc = avgGlucose(week), mGluc = avgGlucose(month), yGluc = avgGlucose(year);
        const wBP = avgBP(week), mBP = avgBP(month), yBP = avgBP(year);

        let html = `
          <div class="report-header" style="margin-bottom:20px; border-bottom:1px solid #ccc; padding-bottom:10px;">
            <h1 style="margin:0; font-size:28px;">Health Report</h1>
            <div style="display:flex; justify-content:space-between; margin-top:5px; color:#aaa;">
              <span>Patient: ${escapeHtml(userName)}</span>
              <span>Printed: ${escapeHtml(printDate)}</span>
            </div>
          </div>
        `;

        html += '<div class="report-section"><h2>Glucose (mg/dL)</h2>';
        function glucoseRow(label, val) {
          if (val===null) return `<div class="report-row"><span class="report-label">${label}:</span> <span class="report-value">—</span></div>`;
          const s = getGlucoseStatus(val,'');
          const arrow = s.warning ? '<span class="trend-up">▲</span>' : (s.trend==='down' ? '<span class="trend-down">▼</span>' : '');
          const badgeClass = s.badgeText.toLowerCase().replace(' ','');
          return `<div class="report-row"><span class="report-label">${label}:</span> <span class="report-value ${s.colorClass}">${val}</span> ${arrow} <span class="status-badge ${badgeClass}">${s.badgeText}</span><div class="report-suggestion">${getGlucoseDescription(val,'')}</div></div>`;
        }
        html += glucoseRow('Weekly', wGluc) + glucoseRow('Monthly', mGluc) + glucoseRow('Yearly', yGluc);
        html += '</div><div class="report-section"><h2>Blood Pressure (mmHg)</h2>';
        function bpRow(label, bp) {
          if (!bp) return `<div class="report-row"><span class="report-label">${label}:</span> <span class="report-value">—</span></div>`;
          const str = `${bp.sys}/${bp.dia}`;
          const s = getBPStatus(str);
          const arrow = s.warning ? '<span class="trend-up">▲</span>' : (s.trend==='down' ? '<span class="trend-down">▼</span>' : '');
          const badgeClass = s.badgeText.toLowerCase().replace(' ','');
          return `<div class="report-row"><span class="report-label">${label}:</span> <span class="report-value ${s.colorClass}">${str}</span> ${arrow} <span class="status-badge ${badgeClass}">${s.badgeText}</span><div class="report-suggestion">${getBPDescription(str)}</div></div>`;
        }
        html += bpRow('Weekly', wBP) + bpRow('Monthly', mBP) + bpRow('Yearly', yBP);
        html += '</div>';
        container.innerHTML = html;
      }

      // ===== PDF Save =====
      window.saveReportAsPDF = function() {
        const card = document.querySelector('#tab-report .card');
        if (!card) return;
        const clone = card.cloneNode(true);
        // Remove the action buttons
        const oldHead = clone.querySelector('.card-head');
        if (oldHead) oldHead.remove();
        // Remove the dynamic header inside reportContent
        const existingHeader = clone.querySelector('#reportContent .report-header');
        if (existingHeader) existingHeader.remove();

        // Add compact PDF class
        clone.classList.add('pdf-report');

        // Create new header
        const { name } = getAuth();
        const userName = name ? name.split(' ')[0] : 'Guest';
        const now = new Date();
        const printDate = now.toLocaleDateString() + ' ' + now.toLocaleTimeString();
        const newHeader = document.createElement('div');
        newHeader.className = 'report-header';
        newHeader.innerHTML = `
          <h1 style="margin:0 0 5px 0; font-size:20pt;">Health Report</h1>
          <div style="display:flex; justify-content:space-between; font-size:10pt; color:#333; border-bottom:1px solid #ccc; padding-bottom:5px;">
            <span>Patient: ${escapeHtml(userName)}</span>
            <span>Printed: ${escapeHtml(printDate)}</span>
          </div>
        `;
        clone.prepend(newHeader);

        const opt = {
          margin: [0.3, 0.3, 0.3, 0.3],
          filename: `Health_Report_${new Date().toISOString().slice(0,10)}.pdf`,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2, letterRendering: true, useCORS: true, logging: false },
          jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' },
          pagebreak: { mode: ['css', 'legacy'] }
        };
        html2pdf().set(opt).from(clone).save();
      };

      // ===== PDF Share =====
      window.shareReport = function() {
        const card = document.querySelector('#tab-report .card');
        if (!card) return;
        const clone = card.cloneNode(true);
        const oldHead = clone.querySelector('.card-head');
        if (oldHead) oldHead.remove();
        const existingHeader = clone.querySelector('#reportContent .report-header');
        if (existingHeader) existingHeader.remove();
        clone.classList.add('pdf-report');
        const { name } = getAuth();
        const userName = name ? name.split(' ')[0] : 'Guest';
        const now = new Date();
        const printDate = now.toLocaleDateString() + ' ' + now.toLocaleTimeString();
        const newHeader = document.createElement('div');
        newHeader.className = 'report-header';
        newHeader.innerHTML = `
          <h1 style="margin:0 0 5px 0; font-size:20pt;">Health Report</h1>
          <div style="display:flex; justify-content:space-between; font-size:10pt; color:#333; border-bottom:1px solid #ccc; padding-bottom:5px;">
            <span>Patient: ${escapeHtml(userName)}</span>
            <span>Printed: ${escapeHtml(printDate)}</span>
          </div>
        `;
        clone.prepend(newHeader);
        const opt = {
          margin: [0.3, 0.3, 0.3, 0.3],
          filename: `Health_Report_${new Date().toISOString().slice(0,10)}.pdf`,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2, letterRendering: true, useCORS: true, logging: false },
          jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' },
          pagebreak: { mode: ['css', 'legacy'] }
        };
        html2pdf().from(clone).set(opt).toPdf().get('pdf').then(function(pdf) {
          const blob = pdf.output('blob');
          const file = new File([blob], opt.filename, { type: 'application/pdf' });
          if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
            navigator.share({ title: 'Health Report', files: [file] }).catch(() => pdf.save(opt.filename));
          } else { pdf.save(opt.filename); }
        });
      };

      window.printReport = function() { window.print(); };

      // Refresh all data
      window.refreshAll = async () => {
        await loadReadings();
        // call all render functions (summary, history, insights, recent, daily points, report)
        // ... (assume they exist)
        renderReport();
        // update other parts as needed
      };

      // Initialize
      async function init() {
        if (!requireAuth()) return;
        // update header, etc.
        await refreshAll();
      }
      init();

      // Dummy store functions (unchanged)
      window.renderStoreCategories = function() { /* ... */ };
    })();
  </script>
