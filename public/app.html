<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <title>Health Tracker</title>

  <!-- ✅ نفس التصميم الموحد -->
  <link rel="stylesheet" href="/style.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

  <div class="app-container">

    <div class="topbar">
      <h2>Health Tracker</h2>
      <div class="topbar-right">
        <span id="hello"></span>
        <button class="btn-inline" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="card">
      <h3>Add Glucose</h3>
      <div class="grid3">
        <input id="gVal" placeholder="Glucose mg/dL (e.g. 110)" inputmode="numeric" />
        <select id="gNote">
          <option value="">(Choose note)</option>
          <option>Fasting (morning)</option>
          <option>Before breakfast</option>
          <option>After breakfast</option>
          <option>Before lunch</option>
          <option>After lunch</option>
          <option>Before dinner</option>
          <option>After dinner</option>
          <option>Before sleep</option>
        </select>
        <button onclick="saveGlucose()">Save Glucose</button>
      </div>

      <!-- ✅ توضيح الألوان -->
      <div class="legend">
        <span class="pill g-ok">Below 100</span>
        <span class="pill g-mid">100–125</span>
        <span class="pill g-high">126+</span>
      </div>
    </div>

    <div class="card">
      <h3>Add Blood Pressure</h3>
      <div class="grid3">
        <input id="bpSys" placeholder="Systolic (e.g. 120)" inputmode="numeric" />
        <input id="bpDia" placeholder="Diastolic (e.g. 80)" inputmode="numeric" />
        <select id="bpNote">
          <option value="">(Choose note)</option>
          <option>Resting</option>
          <option>After walking</option>
          <option>After exercise</option>
          <option>Before sleep</option>
          <option>After coffee</option>
          <option>Feeling dizzy</option>
        </select>
      </div>
      <button onclick="saveBP()">Save Blood Pressure</button>
    </div>

    <div class="card">
      <h3>My Readings</h3>
      <button onclick="loadAll()">Load My Readings</button>

      <div class="tableWrap">
        <table>
          <thead>
            <tr>
              <th>Date/Time</th>
              <th>Type</th>
              <th>Value</th>
              <th>Note</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <h3>Chart</h3>
      <canvas id="chart" height="120"></canvas>
    </div>

  </div>

<script>
const userId = localStorage.getItem("userId");
if (!userId) location.href = "/index.html";

hello.textContent = "Hello, " + (localStorage.getItem("name") || "");

function logout(){
  localStorage.removeItem("userId");
  localStorage.removeItem("name");
  localStorage.removeItem("email");
  location.href = "/index.html";
}

function glucoseClassFromValue(v){
  // ✅ rules:
  // Below 100 => green
  // 100-125 => orange
  // 126+ => red
  const n = Number(String(v).trim());
  if (Number.isNaN(n)) return "";
  if (n < 100) return "g-ok";
  if (n <= 125) return "g-mid";
  return "g-high";
}

async function saveGlucose(){
  const v = gVal.value.trim();
  if (!v) return alert("Enter glucose value");

  await fetch("/api/readings", {
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      userId,
      type: "glucose",
      value: v,
      note: gNote.value
    })
  });

  gVal.value = "";
  gNote.value = "";
  loadAll();
}

async function saveBP(){
  const s = bpSys.value.trim();
  const d = bpDia.value.trim();
  if (!s || !d) return alert("Enter systolic and diastolic");

  await fetch("/api/readings", {
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      userId,
      type: "bp",
      value: `${s}/${d}`,
      note: bpNote.value
    })
  });

  bpSys.value = "";
  bpDia.value = "";
  bpNote.value = "";
  loadAll();
}

async function loadAll(){
  const res = await fetch(`/api/readings/${userId}`);
  const data = await res.json();

  rows.innerHTML = "";

  for (const r of data.slice().reverse()) {
    const tr = document.createElement("tr");

    const isBP = (r.type === "bp");
    const typeLabel = isBP ? "Blood Pressure" : "Glucose";

    // ✅ value cell coloring for glucose only
    let valueHtml = "";
    if (isBP) {
      valueHtml = `<span class="value">${r.value}</span>`;
    } else {
      const cls = glucoseClassFromValue(r.value);
      valueHtml = `<span class="value ${cls}">${r.value}</span>`;
    }

    tr.innerHTML = `
      <td>${new Date(r.ts).toLocaleString()}</td>
      <td>${typeLabel}</td>
      <td>${valueHtml}</td>
      <td>${r.note || ""}</td>
    `;
    rows.appendChild(tr);
  }

  await loadChart();
}

let chartObj = null;
async function loadChart(){
  const res = await fetch(`/api/chart/${userId}`);
  const data = await res.json();

  const ctx = document.getElementById("chart");
  if (chartObj) chartObj.destroy();

  chartObj = new Chart(ctx, {
    type: "line",
    data: {
      labels: data.labels,
      datasets: [
        { label: "Glucose Avg", data: data.glucoseAvg },
        { label: "BP Systolic Avg", data: data.sysAvg },
        { label: "BP Diastolic Avg", data: data.diaAvg }
      ]
    }
  });
}

loadAll();
</script>

</body>
</html>
