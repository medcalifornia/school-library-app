<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>School Library App</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 16px; }
    h1 { margin-bottom: 8px; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 16px; margin: 12px 0; }
    input { padding: 10px; margin: 6px 0; width: 100%; box-sizing: border-box; }
    button { padding: 10px 14px; margin: 6px 6px 6px 0; cursor: pointer; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    pre { background:#111; color:#0f0; padding:12px; border-radius:10px; overflow:auto; }
    .small { color:#666; font-size: 14px; }
    ul { padding-left: 18px; }
    li { margin: 6px 0; }
  </style>
</head>
<body>
  <h1>📚 School Library App</h1>
  <div class="small">Frontend + Express API (Azure-ready)</div>

  <div class="card">
    <h2>Health Check</h2>
    <button onclick="checkHealth()">Check /api/health</button>
    <pre id="healthOut">Click the button…</pre>
  </div>

  <div class="card">
    <h2>Books</h2>
    <button onclick="loadBooks()">Load Books</button>
    <ul id="booksList"></ul>
  </div>

  <div class="card">
    <h2>Add a Book</h2>
    <div class="row">
      <div>
        <label>Title</label>
        <input id="title" placeholder="e.g., The Pragmatic Programmer" />
      </div>
      <div>
        <label>Author</label>
        <input id="author" placeholder="e.g., Andrew Hunt" />
      </div>
    </div>
    <button onclick="addBook()">Add Book</button>
    <pre id="addOut">Fill the form and click Add…</pre>
  </div>

  <div class="card">
    <h2>Delete a Book</h2>
    <label>Book ID</label>
    <input id="deleteId" placeholder="e.g., 1" />
    <button onclick="deleteBook()">Delete</button>
    <pre id="delOut">Enter ID then delete…</pre>
  </div>

<script>
  async function checkHealth() {
    const out = document.getElementById("healthOut");
    out.textContent = "Loading...";
    try {
      const r = await fetch("/api/health");
      const data = await r.json();
      out.textContent = JSON.stringify(data, null, 2);
    } catch (e) {
      out.textContent = "Error: " + e.message;
    }
  }

  async function loadBooks() {
    const list = document.getElementById("booksList");
    list.innerHTML = "<li>Loading...</li>";
    try {
      const r = await fetch("/api/books");
      const data = await r.json();
      list.innerHTML = "";
      data.forEach(b => {
        const li = document.createElement("li");
        li.textContent = `#${b.id} — ${b.title} (by ${b.author})`;
        list.appendChild(li);
      });
    } catch (e) {
      list.innerHTML = `<li>Error: ${e.message}</li>`;
    }
  }

  async function addBook() {
    const title = document.getElementById("title").value;
    const author = document.getElementById("author").value;
    const out = document.getElementById("addOut");
    out.textContent = "Sending...";
    try {
      const r = await fetch("/api/books", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, author })
      });
      const data = await r.json();
      out.textContent = JSON.stringify(data, null, 2);
      await loadBooks();
    } catch (e) {
      out.textContent = "Error: " + e.message;
    }
  }

  async function deleteBook() {
    const id = document.getElementById("deleteId").value;
    const out = document.getElementById("delOut");
    out.textContent = "Deleting...";
    try {
      const r = await fetch(`/api/books/${id}`, { method: "DELETE" });
      const data = await r.json();
      out.textContent = JSON.stringify(data, null, 2);
      await loadBooks();
    } catch (e) {
      out.textContent = "Error: " + e.message;
    }
  }

  // Auto-load on open
  loadBooks();
</script>
</body>
</html>
