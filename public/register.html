<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Health Tracker - Register</title>
  <style>
    body { font-family: Arial; max-width: 520px; margin: 40px auto; padding: 20px; }
    .card { border: 1px solid #ddd; padding: 18px; border-radius: 12px; }
    input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
    button { padding: 10px 14px; cursor: pointer; width: 100%; margin-top: 8px; }
    a { text-decoration: none; display:inline-block; margin-top: 12px; }
    .msg { margin-top: 10px; color: #b00020; min-height: 18px; }
    .ok { color: #0a7a0a; }
  </style>
</head>
<body>

  <h2>Health Tracker</h2>

  <div class="card">
    <h3>Create account</h3>
    <input id="rName" placeholder="Full name" />
    <input id="rEmail" placeholder="Email" />
    <input id="rPhone" placeholder="+15625416709" />
    <input id="rPass" placeholder="Password" type="password" />
    <button onclick="register()">Register</button>

    <div class="msg" id="rMsg"></div>

    <a href="/index.html">← Back to Login</a>
  </div>

<script>
async function register() {
  rMsg.textContent = "";
  rMsg.className = "msg";

  const body = {
    name: rName.value.trim(),
    email: rEmail.value.trim(),
    phone: rPhone.value.trim(),
    password: rPass.value
  };

  const res = await fetch("/api/register", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(body)
  });

  const data = await res.json();

  if (res.ok) {
    rMsg.textContent = data.message || "Registered ✅ Now go back to login.";
    rMsg.className = "msg ok";
  } else {
    rMsg.textContent = data.error || "Registration failed";
  }
}
</script>

</body>
</html>
