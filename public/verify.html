<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Health Tracker - Verify</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

<div class="container">
  <h2>Verify (SMS Code)</h2>

  <div class="card">

    <div class="muted" style="margin-bottom:10px;">
      Enter the code you received by SMS to verify your phone.
    </div>

    <div class="row2">
      <input id="email" placeholder="Email" autocomplete="email" />
      <input id="phone" placeholder="Phone used in registration" autocomplete="tel" />
    </div>

    <input id="code" placeholder="6-digit code from SMS" maxlength="6" inputmode="numeric" />
    <button onclick="verifyCode()">Verify</button>

    <hr class="sep" />

    <h3>Login</h3>
    <input id="pass" type="password" placeholder="Password" autocomplete="current-password" />
    <button onclick="login()">Login</button>

    <pre id="out" class="preBox"></pre>

    <div class="links">
      <a href="/index.html">← Back to Login</a>
    </div>
  </div>
</div>

<script>
(function fill(){
  document.getElementById("email").value = localStorage.getItem("pendingEmail") || "";
  document.getElementById("phone").value = localStorage.getItem("pendingPhone") || "";
})();

async function verifyCode(){
  const body = {
    email: document.getElementById("email").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    code: document.getElementById("code").value.trim()
  };

  const res = await fetch("/api/verify", {
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(body)
  });

  const data = await res.json().catch(()=>({}));
  document.getElementById("out").textContent = JSON.stringify(data, null, 2);
}

async function login(){
  const body = {
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("pass").value
  };

  const res = await fetch("/api/login", {
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(body)
  });

  const data = await res.json().catch(()=>({}));
  document.getElementById("out").textContent = JSON.stringify(data, null, 2);

  // ملاحظة: السيرفر عندك يرجّع userId وليس token
  if (data.userId) {
    localStorage.setItem("userId", data.userId);
    localStorage.setItem("name", data.name || "");
    localStorage.setItem("email", body.email);
    if (data.phone) localStorage.setItem("phone", data.phone);

    localStorage.removeItem("pendingEmail");
    localStorage.removeItem("pendingPhone");
    window.location.href = "/app.html";
  }
}
</script>

</body>
</html>
