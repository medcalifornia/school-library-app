<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Health Tracker - Login</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body class="login-page">

  <main class="login-wrap">
    <section class="card login-card" aria-label="Login">

      <header class="login-head">
        <div class="brand-row">
          <img src="./images/logo.png" alt="DahniTech Logo" class="brand-logo">
          <h2 class="login-title">Health Tracker</h2>
        </div>
        <p class="muted">Login to continue</p>
      </header>

      <form class="login-form" onsubmit="event.preventDefault(); login();" novalidate>
        <label class="field">
          <span class="label">Email</span>
          <input
            id="email"
            type="email"
            placeholder="name@example.com"
            autocomplete="email"
            autocapitalize="none"
            spellcheck="false"
            inputmode="email"
            required
          />
        </label>

        <label class="field">
          <span class="label">Password</span>
          <input
            id="password"
            type="password"
            placeholder="Your password"
            autocomplete="current-password"
            required
          />
        </label>

        <button id="loginBtn" class="btn primary" type="submit">
          <span class="btn-text">Login</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>

      <nav class="links-pro" aria-label="Account links">
        <a class="link-btn" href="./register.html">Create account</a>
        <a class="link-btn link-ghost" href="./forgot.html">Forgot password?</a>
      </nav>

      <div id="msg" class="msg" role="status" aria-live="polite"></div>

      <!-- إعادة الصورة -->
      <div class="hero-image" aria-hidden="true">
        <img src="./images/health-app.jpg" alt="Health Tracker">
      </div>

    </section>
  </main>

  <footer class="app-footer">
    <div class="footer-inner">
      <p>© 2026 El Mehdi Dahni</p>
      <p>DahniTech Solutions</p>
      <p>Health Tracker – Beta Version</p>
      <p class="footer-small">
        Developed as a personal academic project during studies at Cerritos College.
      </p>
    </div>
  </footer>

<script>
  function setLoading(btn, isLoading){
    btn.classList.toggle("loading", !!isLoading);
    btn.disabled = !!isLoading;
  }

  async function login(){
    const emailInput = document.getElementById("email");
    const passInput  = document.getElementById("password");
    const btn        = document.getElementById("loginBtn");
    const msg        = document.getElementById("msg");

    const email = emailInput.value.trim();
    const password = passInput.value;

    msg.className = "msg";
    msg.textContent = "";

    if (!email || !password){
      msg.textContent = "Please enter email and password.";
      return;
    }

    try{
      setLoading(btn, true);

      const res = await fetch("/api/login",{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json().catch(()=>({}));
      if (!res.ok){
        msg.textContent = data.error || "Login failed.";
        return;
      }

      localStorage.setItem("userId", data.userId);
      localStorage.setItem("name", data.name || "");
      localStorage.setItem("phone", data.phone || "");
      localStorage.setItem("email", email);

      window.location.href = "./app.html";
    }catch(e){
      msg.textContent = "Network error. Please try again.";
    }finally{
      setLoading(btn, false);
    }
  }
</script>

</body>
</html>
