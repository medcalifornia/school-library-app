<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Health Tracker - Login</title>
  <style>
    body { font-family: Arial; max-width: 520px; margin: 40px auto; padding: 20px; }
    .card { border: 1px solid #ddd; padding: 18px; border-radius: 12px; }
    input { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
    button { padding: 10px 14px; cursor: pointer; width: 100%; margin-top: 8px; }
    .links { display:flex; justify-content: space-between; margin-top: 12px; }
    a { text-decoration: none; }
    .msg { margin-top: 10px; color: #b00020; min-height: 18px; }
  </style>
</head>
<body>

  <h2>Health Tracker</h2>

  <div class="card">
    <h3>Login</h3>
    <input id="lEmail" placeholder="Email" />
    <input id="lPass" placeholder="Password" type="password" />
    <button onclick="login()">Login</button>

    <div class="links">
      <a href="/register.html">Create account</a>
      <a href="/forgot.html">Forgot password?</a>
    </div>

    <div class="msg" id="lMsg"></div>
  </div>

<script>
async function login() {
  lMsg.textContent = "";

  const body = { email: lEmail.value.trim(), password: lPass.value };
  const res = await fetch("/api/login", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(body)
  });

  const data = await res.json();

  if (data.userId) {
    localStorage.setItem("userId", data.userId);
    localStorage.setItem("name", data.name || "");
    localStorage.setItem("email", body.email);
    if (data.phone) localStorage.setItem("phone", data.phone); // optional

    location.href = "/app.html";
  } else {
    lMsg.textContent = data.error || "Login failed";
  }
}
</script>

</body>
</html>
