<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Health Tracker</title>
<link rel="stylesheet" href="./style.css"/>
</head>

<body class="app-body">

<header class="topbar">
  <div class="top-left">
    <img src="./images/logo.png" class="logo">
    <div>
      <div class="app-title">Health Tracker</div>
      <div class="app-sub" id="subtitle"></div>
    </div>
  </div>
  <button class="btn-logout" onclick="logout()">Logout</button>
</header>

<main class="container">

<section class="card">
  <div class="card-title">Add Reading</div>

  <div class="form-grid">
    <input id="glucoseValue" placeholder="Glucose (mg/dL)">
    <input id="bpSys" placeholder="SYS">
    <input id="bpDia" placeholder="DIA">
  </div>

  <button class="btn-primary" onclick="saveReading()">Save Reading</button>
</section>

<section class="card">
  <div class="card-title">Today's Summary</div>

  <div class="kpi-grid">
    <div class="kpi-box">
      <div class="kpi-label">Glucose</div>
      <div class="kpi-value" id="kpiGlucose">—</div>
    </div>

    <div class="kpi-box">
      <div class="kpi-label">Blood Pressure</div>
      <div class="kpi-value" id="kpiBP">—</div>
    </div>
  </div>
</section>

<section class="card">
  <div class="card-title">14 Day Trend</div>
  <div class="chart-box">
    <svg id="chart" viewBox="0 0 1000 300" preserveAspectRatio="none"></svg>
  </div>
</section>

</main>

<script>
function logout(){
  localStorage.clear();
  window.location.href="./index.html";
}

function getAuth(){
  return localStorage.getItem("userId");
}

async function saveReading(){
  const userId = getAuth();
  const g = document.getElementById("glucoseValue").value.trim();
  const sys = document.getElementById("bpSys").value.trim();
  const dia = document.getElementById("bpDia").value.trim();

  if(g){
    await fetch("/api/readings",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({ userId, type:"glucose", value:g })
    });
  }

  if(sys && dia){
    await fetch("/api/readings",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({ userId, type:"bp", value:sys+"/"+dia })
    });
  }

  refresh();
}

async function refresh(){
  const userId = getAuth();
  const res = await fetch("/api/readings/"+userId);
  const data = await res.json();

  if(!data.length) return;

  const g = data.find(r=>r.type==="glucose");
  const bp = data.find(r=>r.type==="bp");

  if(g) document.getElementById("kpiGlucose").textContent=g.value;
  if(bp) document.getElementById("kpiBP").textContent=bp.value;

  renderChart(data);
}

function renderChart(data){
  const svg=document.getElementById("chart");
  svg.innerHTML="";

  const glucose=data.filter(r=>r.type==="glucose").slice(0,14).reverse();
  const w=1000, h=300;

  glucose.forEach((r,i)=>{
    const x=(i*(w/14))+50;
    const y=h-(Number(r.value)*1.2);
    const circle=document.createElementNS("http://www.w3.org/2000/svg","circle");
    circle.setAttribute("cx",x);
    circle.setAttribute("cy",y);
    circle.setAttribute("r",6);
    circle.setAttribute("fill","#2b6cb0");
    svg.appendChild(circle);
  });
}

refresh();
</script>

</body>
</html>
