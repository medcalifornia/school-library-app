<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Health Tracker - Register</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <div class="container">
    <h2>Health Tracker</h2>

    <div class="card">
      <h3>Create account</h3>

      <form id="registerForm">
        <input id="rName" placeholder="Full name" autocomplete="name" required />
        <input id="rEmail" placeholder="Email" type="email" autocomplete="email" inputmode="email" required />
        <input id="rPhone" placeholder="+12225554444" autocomplete="tel" inputmode="tel" required />
        <input id="rPass" placeholder="Password" type="password" autocomplete="new-password" required />

        <button id="rBtn" type="submit">Register</button>
      </form>

      <div class="msg" id="rMsg"></div>

      <div class="links">
        <a href="/index.html">← Back to Login</a>
      </div>
    </div>
  </div>

<script>
const rForm = document.getElementById("registerForm");
const rBtn  = document.getElementById("rBtn");
const rMsg  = document.getElementById("rMsg");

function normalizePhone(p){
  p = (p || "").trim();
  if (!p) return "";
  return p.startsWith("+") ? p : ("+" + p);
}

rForm.addEventListener("submit", async (e) => {
  e.preventDefault();

  rMsg.textContent = "";
  rMsg.className = "msg";
  rBtn.disabled = true;

  const body = {
    name: document.getElementById("rName").value.trim(),
    email: document.getElementById("rEmail").value.trim().toLowerCase(),
    phone: normalizePhone(document.getElementById("rPhone").value),
    password: document.getElementById("rPass").value
  };

  if (!body.name || !body.email || !body.phone || !body.password) {
    rMsg.textContent = "Please fill all fields.";
    rBtn.disabled = false;
    return;
  }

  try {
    const res = await fetch("/api/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });

    const data = await res.json().catch(() => ({}));

    if (!res.ok) {
      rMsg.textContent = data.error || "Registration failed";
      rBtn.disabled = false;
      return;
    }

    rMsg.textContent = "Registered successfully ✅ Redirecting to login...";
    rMsg.className = "msg ok";

    setTimeout(() => {
      window.location.href = "/index.html";
    }, 1000);

  } catch (err) {
    rMsg.textContent = "Network error";
    rBtn.disabled = false;
  }
});
</script>

</body>
</html>
