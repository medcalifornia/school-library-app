<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>School Library App</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 30px auto; padding: 0 16px; }
<div class="card">
  <h3>Register / Verify / Login</h3>

  <input id="email" placeholder="Email" />
  <input id="password" placeholder="Password (min 8 chars)" type="password" />

  <button onclick="register()">Register (send code)</button>

  <input id="code" placeholder="Verification code (6 digits)" />
  <button onclick="verify()">Verify code</button>

  <button onclick="login()">Login</button>

  <pre id="authOut">Not logged in</pre>
</div>
  </style>
</head>
<body>
  <h1>📚 School Library App</h1>
  <div class="small">Frontend + Express API (Azure-ready)</div>

  <div class="card">
    <h2>Health Check</h2>
    <button onclick="checkHealth()">Check /api/health</button>
    <pre id="healthOut">Click the button…</pre>
  </div>

  <div class="card">
    <h2>Books</h2>
    <button onclick="loadBooks()">Load Books</button>
    <ul id="booksList"></ul>
  </div>

  <div class="card">
    <h2>Add a Book</h2>
    <div class="row">
      <div>
        <label>Title</label>
        <input id="title" placeholder="e.g., The Pragmatic Programmer" />
      </div>
      <div>
        <label>Author</label>
        <input id="author" placeholder="e.g., Andrew Hunt" />
      </div>
    </div>
    <button onclick="addBook()">Add Book</button>
    <pre id="addOut">Fill the form and click Add…</pre>
  </div>

  <div class="card">
    <h2>Delete a Book</h2>
    <label>Book ID</label>
    <input id="deleteId" placeholder="e.g., 1" />
    <button onclick="deleteBook()">Delete</button>
    <pre id="delOut">Enter ID then delete…</pre>
  </div>

<script>
let TOKEN = localStorage.getItem("token") || "";

function setAuthOutput(obj) {
  document.getElementById("authOut").textContent = JSON.stringify(obj, null, 2);
}

async function register() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const r = await fetch("/api/auth/register", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  });

  const data = await r.json();
  setAuthOutput(data);
}

async function verify() {
  const email = document.getElementById("email").value;
  const code = document.getElementById("code").value;

  const r = await fetch("/api/auth/verify", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, code })
  });

  const data = await r.json();
  setAuthOutput(data);
}

async function login() {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const r = await fetch("/api/auth/login", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, password })
  });

  const data = await r.json();

  if (data.token) {
    TOKEN = data.token;
    localStorage.setItem("token", TOKEN);
  }

  setAuthOutput(data);
}

// Example call to a protected endpoint:
async function whoAmI() {
  const r = await fetch("/api/auth/me", {
    headers: { "Authorization": `Bearer ${TOKEN}` }
  });
  setAuthOutput(await r.json());
}
</script>
</body>
</html>
