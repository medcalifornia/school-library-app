<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Health Tracker</title>

  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Pagination styles (so it works even if style.css doesn't have it) -->
  <style>
    .pager{
      margin-top: 14px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-start;
    }
    .pager .btn{ width:auto; padding: 10px 12px; border-radius: 12px; }
    .pager-num{
      border: 1px solid #d9d9e3;
      background: #fff;
      color: #111;
      font-weight: 700;
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      min-width: 44px;
    }
    .pager-num.active{
      background: #4a6cf7;
      color: #fff;
      border-color: #4a6cf7;
    }
    .pager-dots{
      padding: 0 6px;
      color: #666;
      font-weight: 700;
    }
    .pager-info{
      margin-top: 10px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>

<body>
<div class="header">
  <div class="header-left">
    <h1 class="app-title">Health Tracker</h1>
    <div class="header-info">
      <span id="hello"></span>
      <span class="sep">•</span>
      <span id="now"></span>
    </div>
  </div>

  <button class="btn btn-logout" onclick="logout()">Logout</button>
</div>

<div class="container container-wide">

  <div class="card">
    <h3>Add Glucose</h3>

    <div class="grid3">
      <input id="gVal" placeholder="Glucose mg/dL (e.g. 110)" inputmode="numeric" />
      <select id="gNote">
        <option value="">(Choose note)</option>
        <option>Fasting (morning)</option>
        <option>Before breakfast</option>
        <option>After breakfast</option>
        <option>Before lunch</option>
        <option>After lunch</option>
        <option>Before dinner</option>
        <option>After dinner</option>
        <option>Before sleep</option>
      </select>

      <button class="btn" onclick="saveGlucose()">Save Glucose</button>
    </div>
  </div>

  <div class="card">
    <h3>Add Blood Pressure</h3>

    <div class="grid3">
      <input id="bpSys" placeholder="Systolic (e.g. 120)" inputmode="numeric" />
      <input id="bpDia" placeholder="Diastolic (e.g. 80)" inputmode="numeric" />
      <select id="bpNote">
        <option value="">(Choose note)</option>
        <option>Resting</option>
        <option>After walking</option>
        <option>After exercise</option>
        <option>Before sleep</option>
        <option>After coffee</option>
        <option>Feeling dizzy</option>
      </select>
    </div>

    <button class="btn" onclick="saveBP()">Save Blood Pressure</button>
  </div>

  <!-- ✅ Chart FIRST -->
  <div class="card">
    <h3>Chart</h3>
    <canvas id="chart" height="120"></canvas>
  </div>

  <!-- ✅ My Readings AFTER Chart -->
  <div class="card">
    <div class="row-between">
      <h3>My Readings</h3>
      <button class="btn btn-small" onclick="loadAll()">Load My Readings</button>
    </div>

    <table class="readings">
      <thead>
        <tr>
          <th>Date/Time</th>
          <th>Type</th>
          <th>Value</th>
          <th>Note</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <div class="legend">
      <div><span class="dot ok"></span> Normal</div>
      <div><span class="dot warn"></span> Elevated / Prediabetes</div>
      <div><span class="dot bad"></span> High</div>
    </div>

    <!-- ✅ Pagination -->
    <div id="pagerInfo" class="pager-info"></div>
    <div id="pagination" class="pager"></div>
  </div>

</div>

<script>
const userId = localStorage.getItem("userId");
if (!userId) location.href = "/index.html";

hello.textContent = "Hello, " + (localStorage.getItem("name") || "");

// ===== Live Date/Time (clean: only once) =====
function updateNow(){
  now.textContent = new Date().toLocaleString();
}
updateNow();
setInterval(updateNow, 1000);

// ===== Logout =====
function logout(){
  localStorage.removeItem("userId");
  localStorage.removeItem("name");
  localStorage.removeItem("email");
  location.href = "/index.html";
}

/* ===== Coloring Functions ===== */

// Glucose: <100 green, 100-125 orange, >=126 red
function glucoseClass(v){
  const n = Number(v);
  if (Number.isNaN(n)) return "";
  if (n < 100) return "glucose-low";
  if (n <= 125) return "glucose-mid";
  return "glucose-high";
}

// BP: Normal green, Elevated orange, High red (ACC/AHA)
function bpHtml(v){
  const parts = String(v).split("/");
  const s = Number(parts[0]);
  const d = Number(parts[1]);

  if (Number.isNaN(s) || Number.isNaN(d)) return String(v);

  let cls = "bp-low"; // Normal
  if (s >= 120 && s <= 129 && d < 80) cls = "bp-mid"; // Elevated
  if (s >= 130 || d >= 80) cls = "bp-high"; // High

  return `<span class="${cls}">${s}/${d}</span>`;
}

/* ===== Save ===== */

async function saveGlucose(){
  const v = gVal.value.trim();
  if (!v) return alert("Enter glucose value");

  await fetch("/api/readings", {
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      userId,
      type: "glucose",
      value: v,
      note: gNote.value
    })
  });

  gVal.value = "";
  gNote.value = "";
  loadAll();
}

async function saveBP(){
  const s = bpSys.value.trim();
  const d = bpDia.value.trim();
  if (!s || !d) return alert("Enter systolic and diastolic");

  await fetch("/api/readings", {
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      userId,
      type: "bp",
      value: `${s}/${d}`,
      note: bpNote.value
    })
  });

  bpSys.value = "";
  bpDia.value = "";
  bpNote.value = "";
  loadAll();
}

/* ===== Table Helpers ===== */

function fmtType(t){
  return t === "bp" ? "Blood Pressure" : "Glucose";
}

function fmtValue(r){
  if (r.type === "glucose"){
    const cls = glucoseClass(r.value);
    return `<span class="${cls}">${r.value}</span>`;
  }
  return bpHtml(r.value);
}

/* ===== Pagination State ===== */
const pageSize = 10;
let currentPage = 1;
let allReadings = []; // newest first

function renderPage(){
  rows.innerHTML = "";

  const total = allReadings.length;
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  currentPage = Math.min(Math.max(1, currentPage), totalPages);

  const start = (currentPage - 1) * pageSize;
  const pageItems = allReadings.slice(start, start + pageSize);

  for (const r of pageItems) {
    const dt = new Date(r.ts).toLocaleString();
    const tr = document.createElement("tr");

    // background class based on type
    if (r.type === "glucose") tr.classList.add("row-glucose");
    if (r.type === "bp") tr.classList.add("row-bp");

    tr.innerHTML = `
      <td data-label="Date/Time">${dt}</td>
      <td data-label="Type">${fmtType(r.type)}</td>
      <td data-label="Value">${fmtValue(r)}</td>
      <td data-label="Note">${r.note || ""}</td>
    `;
    rows.appendChild(tr);
  }

  // page info
  const shownFrom = total ? (start + 1) : 0;
  const shownTo = Math.min(start + pageItems.length, total);
  pagerInfo.textContent = `Showing ${shownFrom}-${shownTo} of ${total} (Page ${currentPage} of ${totalPages})`;

  renderPagination(totalPages);
}

function renderPagination(totalPages){
  const paginationDiv = document.getElementById("pagination");
  paginationDiv.innerHTML = "";
  if (totalPages <= 1) return;

  // Prev
  const prev = document.createElement("button");
  prev.className = "btn btn-small";
  prev.textContent = "Prev";
  prev.disabled = currentPage === 1;
  prev.onclick = () => { currentPage--; renderPage(); };
  paginationDiv.appendChild(prev);

  // Page numbers with dots
  const maxButtons = 5;
  const pages = [];

  if (totalPages <= 7) {
    for (let i = 1; i <= totalPages; i++) pages.push(i);
  } else {
    pages.push(1);

    let start = Math.max(2, currentPage - Math.floor(maxButtons / 2));
    let end = Math.min(totalPages - 1, start + maxButtons - 1);
    start = Math.max(2, end - maxButtons + 1);

    if (start > 2) pages.push("...");

    for (let i = start; i <= end; i++) pages.push(i);

    if (end < totalPages - 1) pages.push("...");

    pages.push(totalPages);
  }

  for (const p of pages){
    if (p === "..."){
      const span = document.createElement("span");
      span.className = "pager-dots";
      span.textContent = "…";
      paginationDiv.appendChild(span);
      continue;
    }

    const btn = document.createElement("button");
    btn.className = "pager-num" + (p === currentPage ? " active" : "");
    btn.textContent = String(p);
    btn.onclick = () => { currentPage = p; renderPage(); };
    paginationDiv.appendChild(btn);
  }

  // Next
  const next = document.createElement("button");
  next.className = "btn btn-small";
  next.textContent = "Next";
  next.disabled = currentPage === totalPages;
  next.onclick = () => { currentPage++; renderPage(); };
  paginationDiv.appendChild(next);
}

/* ===== Load All Readings ===== */

async function loadAll(){
  const res = await fetch(`/api/readings/${userId}`);
  const data = await res.json();

  // newest first
  allReadings = (Array.isArray(data) ? data : []).slice().reverse();
  currentPage = 1;

  renderPage();
  await loadChart(); // chart loads once after fetch
}

/* ===== Chart ===== */

let chartObj = null;

async function loadChart(){
  const res = await fetch(`/api/chart/${userId}`);
  const data = await res.json();

  const ctx = document.getElementById("chart");
  if (chartObj) chartObj.destroy();

  chartObj = new Chart(ctx, {
    type: "line",
    data: {
      labels: data.labels,
      datasets: [
        { label: "Glucose Avg", data: data.glucoseAvg },
        { label: "BP Systolic Avg", data: data.sysAvg },
        { label: "BP Diastolic Avg", data: data.diaAvg }
      ]
    }
  });
}

loadAll();
</script>

</body>
</html>
