<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Verify - Diabetes Tracker</title>
  <style>
    body{font-family:Arial;margin:24px;background:#f6f7fb}
    .card{max-width:520px;background:#fff;padding:18px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
    input{width:100%;padding:10px;margin:8px 0}
    button{padding:10px 14px;cursor:pointer}
    pre{background:#111;color:#0f0;padding:10px;border-radius:10px;overflow:auto}
  </style>
</head>
<body>
  <div class="card">
    <h2>Verify Account</h2>
    <input id="email" placeholder="Email" />
    <input id="code" placeholder="6-digit code" />
    <button onclick="verify()">Verify</button>

    <hr/>
    <h3>Login after verification</h3>
    <input id="pass" type="password" placeholder="Password" />
    <button onclick="login()">Login</button>

    <pre id="out">...</pre>
  </div>

<script>
  // auto-fill email from registration
  document.getElementById("email").value = localStorage.getItem("pendingEmail") || "";

  async function verify(){
    const body = {
      email: document.getElementById("email").value,
      code: document.getElementById("code").value
    };

    const res = await fetch("/api/verify", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(body)
    });

    const data = await res.json().catch(()=>({}));
    document.getElementById("out").textContent = JSON.stringify(data,null,2);
  }

  async function login(){
    const body = {
      email: document.getElementById("email").value,
      password: document.getElementById("pass").value
    };

    const res = await fetch("/api/login", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(body)
    });

    const data = await res.json().catch(()=>({}));
    document.getElementById("out").textContent = JSON.stringify(data,null,2);

    if (data.token) {
      localStorage.setItem("token", data.token);
      localStorage.removeItem("pendingEmail");
      window.location.href = "/app.html";
    }
  }
</script>
</body>
</html>
