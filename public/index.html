<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Health Tracker - Login</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body class="login-page">
  <div class="container">
    <div class="card">

      <div class="login-head">
        <h2 class="login-title">Health Tracker</h2>
        <p class="muted">Login to continue</p>
      </div>

      <input id="email" type="email" placeholder="Email" autocomplete="email" />
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" />

      <button class="btn" onclick="login()">Login</button>

      <!-- ✅ links side-by-side (professional) -->
      <div class="links-pro">
        <a class="link-btn" href="./register.html">Create account</a>
        <a class="link-btn link-ghost" href="./forgot.html">Forgot password?</a>
      </div>

      <div id="msg" class="msg"></div>

      <!-- ✅ FIXED IMAGE PATH (your file is inside /images/) -->
      <div class="hero-image">
        <img src="./images/health-app.jpg" alt="Health Tracker" />
      </div>

    </div>
  </div>

<script>
async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const msg = document.getElementById("msg");
  msg.className = "msg";
  msg.textContent = "";

  if (!email || !password){
    msg.textContent = "Please enter email and password.";
    return;
  }

  try{
    const res = await fetch("/api/login",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ email, password })
    });

    const data = await res.json().catch(()=>({}));
    if (!res.ok){
      msg.textContent = data.error || "Login failed.";
      return;
    }

    localStorage.setItem("userId", data.userId);
    localStorage.setItem("name", data.name || "");
    localStorage.setItem("email", email);

    location.href = "./app.html";
  }catch(e){
    msg.textContent = "Network error. Please try again.";
  }
}
</script>

</body>
</html>
