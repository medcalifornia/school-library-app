<header class="appbar">
  <div class="appbar-inner">
    <div class="brand">
      <div class="brand-title">Health Tracker</div>
      <div class="brand-sub" id="subtitle"></div>
    </div>
    <!-- تم إزالة صورة الشعار من هنا لأنها تسبب عدم انتظام في الترتيب -->
    <div class="appbar-actions">
      <button class="chip" id="whoamiChip" type="button" aria-label="User">
        <span class="dot"></span>
        <span id="whoamiText">Connected</span>
      </button>

      <button class="icon-btn" type="button" onclick="logout()" aria-label="Logout">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path d="M10 17l1.41-1.41L8.83 13H21v-2H8.83l2.58-2.59L10 7l-7 7 7 7z"></path>
          <path d="M3 3h8v2H5v14h6v2H3V3z"></path>
        </svg>
        <span class="hide-sm">Logout</span>
      </button>
    </div>
  </div>
</header>
