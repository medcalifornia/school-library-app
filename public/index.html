<!DOCTYPE html>
<html>
<head>
  <title>Health Tracker</title>
  <style>
    body { font-family: Arial; max-width: 400px; margin: auto; padding: 40px; }
    input { width: 100%; padding: 8px; margin: 6px 0; }
    button { width: 100%; padding: 8px; margin: 6px 0; }
    .box { border: 1px solid #ddd; padding: 20px; margin-bottom: 20px; }
    .link { color: blue; cursor: pointer; font-size: 14px; }
  </style>
</head>
<body>

<h2>Health Tracker</h2>

<div class="box">
  <h3>Register</h3>
  <input type="text" id="regName" placeholder="Full Name">
  <input type="email" id="regEmail" placeholder="Email">
  <input type="password" id="regPassword" placeholder="Password">
  <button onclick="register()">Register</button>
</div>

<div class="box">
  <h3>Login</h3>
  <input type="email" id="loginEmail" placeholder="Email">
  <input type="password" id="loginPassword" placeholder="Password">
  <button onclick="login()">Login</button>
  <div class="link" onclick="showRecovery()">Forgot Password?</div>
</div>

<div class="box" id="recoveryBox" style="display:none;">
  <h3>Recover Account</h3>
  <input type="email" id="recoverEmail" placeholder="Enter your registered email">
  <input type="password" id="newPassword" placeholder="New Password">
  <button onclick="recoverPassword()">Reset Password</button>
</div>

<script>

let users = JSON.parse(localStorage.getItem("users")) || [];

function saveUsers() {
  localStorage.setItem("users", JSON.stringify(users));
}

function register() {
  const name = regName.value;
  const email = regEmail.value;
  const password = regPassword.value;

  if (!name || !email || !password) {
    alert("Fill all fields");
    return;
  }

  if (users.find(u => u.email === email)) {
    alert("User already exists");
    return;
  }

  users.push({ name, email, password });
  saveUsers();

  alert("Registration successful!");
}

function login() {
  const email = loginEmail.value;
  const password = loginPassword.value;

  const user = users.find(u => u.email === email && u.password === password);

  if (!user) {
    alert("Invalid email or password");
    return;
  }

  localStorage.setItem("currentUser", JSON.stringify(user));
  window.location.href = "app.html";
}

function showRecovery() {
  document.getElementById("recoveryBox").style.display = "block";
}

function recoverPassword() {
  const email = recoverEmail.value;
  const newPass = newPassword.value;

  const user = users.find(u => u.email === email);

  if (!user) {
    alert("Email not found");
    return;
  }

  if (!newPass) {
    alert("Enter new password");
    return;
  }

  user.password = newPass;
  saveUsers();

  alert("Password updated successfully! You can login now.");
  document.getElementById("recoveryBox").style.display = "none";
}

</script>

</body>
</html>
