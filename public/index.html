<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Health Tracker - Login</title>

  <!-- ربط ملف CSS -->
  <link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="container">

  <h2>Health Tracker</h2>

  <div class="card">
    <h3>Login</h3>

    <input id="lEmail" placeholder="Email" />
    <input id="lPass" placeholder="Password" type="password" />
    <button onclick="login()">Login</button>

    <div class="links">
      <a href="/register.html">Create account</a>
      <a href="/forgot.html">Forgot password?</a>
    </div>

    <div class="msg" id="lMsg"></div>
  </div>

  <!-- الصورة داخل نفس الـ container -->
  <div class="hero-image">
    <img src="/images/health-app.jpg" alt="Health App">
  </div>

</div>

<script>
async function login() {
  lMsg.textContent = "";

  const body = { email: lEmail.value.trim(), password: lPass.value };

  const res = await fetch("/api/login", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(body)
  });

  const data = await res.json();

  if (data.userId) {
    localStorage.setItem("userId", data.userId);
    localStorage.setItem("name", data.name || "");
    localStorage.setItem("email", body.email);
    if (data.phone) localStorage.setItem("phone", data.phone);
    location.href = "/app.html";
  } else {
    lMsg.textContent = data.error || "Login failed";
  }
}
</script>

</body>
</html>
