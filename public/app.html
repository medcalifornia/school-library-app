<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Health Tracker · Dashboard</title>
  <link rel="stylesheet" href="./style.css" />
  <!-- مكتبة html2pdf -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <style>
    /* ... (جميع الأنماط السابقة كما هي، لم تتغير) ... */
    /* أنماط التقرير النظيف */
    .report-section {
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 24px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .report-section h2 {
      margin: 0 0 20px 0;
      font-size: 20px;
      font-weight: 600;
      color: #ddd;
      border-left: 4px solid #4c7dff;
      padding-left: 12px;
    }
    .report-row {
      margin-bottom: 24px;
      padding-bottom: 20px;
      border-bottom: 1px dashed rgba(255,255,255,0.1);
    }
    .report-row:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }
    .report-label {
      font-weight: 600;
      font-size: 16px;
      color: #ccc;
      margin-bottom: 6px;
    }
    .report-value-line {
      margin-bottom: 8px;
    }
    .report-value {
      font-size: 28px;
      font-weight: 700;
      margin-right: 8px;
    }
    .report-suggestion {
      font-size: 13px;
      color: #aaa;
      line-height: 1.5;
      background: rgba(0,0,0,0.2);
      padding: 12px 16px;
      border-radius: 12px;
      margin-top: 8px;
    }
    /* في وضع الطباعة */
    @media print {
      .report-section {
        background: #f9f9f9;
        border: 1px solid #ddd;
        color: black;
      }
      .report-section h2 {
        color: #111;
        border-left-color: #2c3e50;
      }
      .report-label {
        color: #222;
      }
      .report-suggestion {
        background: #f0f0f0;
        color: #222;
        border: 1px solid #ccc;
      }
      .status-badge {
        border: 1px solid currentColor !important;
        background: transparent !important;
        color: black !important;
      }
    }
  </style>
</head>
<body>
  <!-- ... (كل المحتوى السابق كما هو حتى تبويب Report) ... -->

  <!-- TAB: Report -->
  <section id="tab-report" class="tab-panel">
    <section class="card">
      <div class="card-head" style="display: flex; justify-content: space-between; align-items: center;">
        <h2>Health Report</h2>
        <div style="display: flex; gap: 8px;">
          <button class="btn secondary" onclick="shareReport()">📤 Share</button>
          <button class="btn primary" onclick="printReport()">🖨️ Print</button>
          <button class="btn secondary" onclick="saveReportAsPDF()">💾 Save</button>
        </div>
      </div>
      <p class="muted">Average readings with suggestions</p>
      <div id="reportContent" class="report-grid">
        <!-- سيتم التعبئة بواسطة JS -->
      </div>
    </section>
  </section>

  <!-- ... (باقي التبويبات) ... -->

  <script>
    // ===== دالة renderReport المعدلة (نظيفة تماماً) =====
    function renderReport() {
      const container = $('reportContent');
      if (!container) return;

      const { name } = getAuth();
      const userName = name ? name.split(' ')[0] : 'Guest';
      const now = new Date();
      const printDate = now.toLocaleDateString() + ' ' + now.toLocaleTimeString();

      const oneWeekAgo = new Date(now.getTime() - 7 * 86400000);
      const oneMonthAgo = new Date(now.getTime() - 30 * 86400000);
      const oneYearAgo = new Date(now.getTime() - 365 * 86400000);

      const weekReadings = allReadings.filter(r => parseDate(r.ts) >= oneWeekAgo);
      const monthReadings = allReadings.filter(r => parseDate(r.ts) >= oneMonthAgo);
      const yearReadings = allReadings.filter(r => parseDate(r.ts) >= oneYearAgo);

      function avgGlucose(arr) {
        const vals = arr.filter(r => r.type === 'glucose').map(r => Number(r.value)).filter(n => !isNaN(n));
        return vals.length ? Math.round(vals.reduce((a,b) => a+b, 0) / vals.length) : null;
      }

      function avgBP(arr) {
        const bpReadings = arr.filter(r => r.type === 'bp');
        let totalSys = 0, totalDia = 0, count = 0;
        bpReadings.forEach(r => {
          const parts = r.value.split('/').map(Number);
          if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
            totalSys += parts[0];
            totalDia += parts[1];
            count++;
          }
        });
        if (count === 0) return null;
        return { sys: Math.round(totalSys / count), dia: Math.round(totalDia / count) };
      }

      const weeklyGlucose = avgGlucose(weekReadings);
      const monthlyGlucose = avgGlucose(monthReadings);
      const yearlyGlucose = avgGlucose(yearReadings);

      const weeklyBP = avgBP(weekReadings);
      const monthlyBP = avgBP(monthReadings);
      const yearlyBP = avgBP(yearReadings);

      // رأس التقرير (يظهر مرة واحدة)
      let html = `
        <div style="margin-bottom:24px; border-bottom:1px solid rgba(255,255,255,0.2); padding-bottom:12px;">
          <h1 style="margin:0 0 8px 0; font-size:28px;">Health Report</h1>
          <div style="display:flex; justify-content:space-between; font-size:14px; color:#aaa;">
            <span>Patient: ${escapeHtml(userName)}</span>
            <span>Printed: ${escapeHtml(printDate)}</span>
          </div>
        </div>
      `;

      // قسم الجلوكوز
      html += '<div class="report-section"><h2>Glucose (mg/dL)</h2>';

      function glucoseRow(label, value) {
        if (value === null) {
          return `<div class="report-row"><div class="report-label">${label}:</div><div class="report-value-line"><span class="report-value">—</span></div></div>`;
        }
        const status = getGlucoseStatus(value, '');
        const badgeClass = status.badgeText.toLowerCase().replace(' ', '');
        const arrow = status.warning ? '<span class="trend-up">▲</span>' : (status.trend === 'down' ? '<span class="trend-down">▼</span>' : '');
        const suggestion = getGlucoseDescription(value, '');
        return `
          <div class="report-row">
            <div class="report-label">${label}:</div>
            <div class="report-value-line">
              <span class="report-value ${status.colorClass}">${value}</span> ${arrow}
              <span class="status-badge ${badgeClass}">${status.badgeText}</span>
            </div>
            <div class="report-suggestion">${suggestion}</div>
          </div>
        `;
      }

      html += glucoseRow('Weekly', weeklyGlucose);
      html += glucoseRow('Monthly', monthlyGlucose);
      html += glucoseRow('Yearly', yearlyGlucose);
      html += '</div>';

      // قسم ضغط الدم
      html += '<div class="report-section"><h2>Blood Pressure (mmHg)</h2>';

      function bpRow(label, bpAvg) {
        if (!bpAvg) {
          return `<div class="report-row"><div class="report-label">${label}:</div><div class="report-value-line"><span class="report-value">—</span></div></div>`;
        }
        const bpString = `${bpAvg.sys}/${bpAvg.dia}`;
        const status = getBPStatus(bpString);
        const badgeClass = status.badgeText.toLowerCase().replace(' ', '');
        const arrow = status.warning ? '<span class="trend-up">▲</span>' : (status.trend === 'down' ? '<span class="trend-down">▼</span>' : '');
        const suggestion = getBPDescription(bpString);
        return `
          <div class="report-row">
            <div class="report-label">${label}:</div>
            <div class="report-value-line">
              <span class="report-value ${status.colorClass}">${bpString}</span> ${arrow}
              <span class="status-badge ${badgeClass}">${status.badgeText}</span>
            </div>
            <div class="report-suggestion">${suggestion}</div>
          </div>
        `;
      }

      html += bpRow('Weekly', weeklyBP);
      html += bpRow('Monthly', monthlyBP);
      html += bpRow('Yearly', yearlyBP);
      html += '</div>';

      container.innerHTML = html;
    }

    // باقي الدوال (saveReportAsPDF, shareReport, printReport) تبقى كما هي مع التأكد من استخدام clone وإزالة .card-head
    window.saveReportAsPDF = function() {
      const card = document.querySelector('#tab-report .card');
      if (!card) return;

      const clone = card.cloneNode(true);
      const oldHead = clone.querySelector('.card-head');
      if (oldHead) oldHead.remove(); // نزيل الأزرار والعنوان الأصلي

      // إضافة رأس جديد نظيف (مرة واحدة)
      const { name } = getAuth();
      const userName = name ? name.split(' ')[0] : 'Guest';
      const now = new Date();
      const printDate = now.toLocaleDateString() + ' ' + now.toLocaleTimeString();

      const newHeader = document.createElement('div');
      newHeader.style.marginBottom = '20px';
      newHeader.style.borderBottom = '1px solid #ccc';
      newHeader.style.paddingBottom = '10px';
      newHeader.innerHTML = `
        <h1 style="margin:0 0 8px 0; font-size:28px; color:#000;">Health Report</h1>
        <div style="display:flex; justify-content:space-between; font-size:14px; color:#333;">
          <span>Patient: ${escapeHtml(userName)}</span>
          <span>Printed: ${escapeHtml(printDate)}</span>
        </div>
      `;
      clone.prepend(newHeader);

      const opt = {
        margin: [0.5, 0.5, 0.5, 0.5],
        filename: `Health_Report_${new Date().toISOString().slice(0,10)}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, letterRendering: true, useCORS: true },
        jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(clone).save();
    };

    window.shareReport = function() {
      const card = document.querySelector('#tab-report .card');
      if (!card) return;

      const clone = card.cloneNode(true);
      const oldHead = clone.querySelector('.card-head');
      if (oldHead) oldHead.remove();

      const { name } = getAuth();
      const userName = name ? name.split(' ')[0] : 'Guest';
      const now = new Date();
      const printDate = now.toLocaleDateString() + ' ' + now.toLocaleTimeString();

      const newHeader = document.createElement('div');
      newHeader.style.marginBottom = '20px';
      newHeader.style.borderBottom = '1px solid #ccc';
      newHeader.style.paddingBottom = '10px';
      newHeader.innerHTML = `
        <h1 style="margin:0 0 8px 0; font-size:28px; color:#000;">Health Report</h1>
        <div style="display:flex; justify-content:space-between; font-size:14px; color:#333;">
          <span>Patient: ${escapeHtml(userName)}</span>
          <span>Printed: ${escapeHtml(printDate)}</span>
        </div>
      `;
      clone.prepend(newHeader);

      const opt = {
        margin: [0.5, 0.5, 0.5, 0.5],
        filename: `Health_Report_${new Date().toISOString().slice(0,10)}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, letterRendering: true, useCORS: true },
        jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().from(clone).set(opt).toPdf().get('pdf').then(function(pdf) {
        const blob = pdf.output('blob');
        const file = new File([blob], opt.filename, { type: 'application/pdf' });
        if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ title: 'Health Report', files: [file] }).catch(() => pdf.save(opt.filename));
        } else {
          pdf.save(opt.filename);
        }
      });
    };

    window.printReport = function() {
      window.print();
    };
  </script>
</body>
</html>
