<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Health Tracker · Login</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body class="login-page">
  <div class="login-wrap">
    <div class="card login-card">
      <div class="brand-row">
        <img src="./images/logo.png" alt="DahniTech Solutions" class="brand-logo" />
        <span class="login-title">Health Tracker</span>
      </div>
      <p class="muted">Sign in to your account</p>

      <div class="login-form">
        <label class="field">
          <span class="label">Email or phone</span>
          <input type="text" id="username" placeholder="Enter your email or phone" />
        </label>
        <label class="field">
          <span class="label">Password</span>
          <input type="password" id="password" placeholder="Enter your password" />
        </label>

        <div class="links-pro">
          <button class="link-btn link-ghost" onclick="window.location.href='https://dahnitechsolutions.com'">Visit Site</button>
          <a href="#" class="link-btn" onclick="forgotPassword()">Forgot password?</a>
        </div>

        <button class="btn primary" onclick="login()">
          <span class="btn-text">Sign in</span>
          <span class="spinner"></span>
        </button>
        <div id="msg" class="msg"></div>
      </div>

      <div class="links-pro">
        <span class="muted">New here?</span>
        <a href="#" class="link-btn" onclick="createAccount()">Create Account</a>
      </div>
    </div>

    <div class="hero-image">
      <img src="./images/hero.jpg" alt="Health tracking" />
    </div>
  </div>

  <footer class="app-footer">
    <div class="footer-inner">
      © 2025 DahniTech Solutions. All rights reserved.<br />
      <span class="footer-small">Version 2.0 · Better every day</span>
    </div>
  </footer>

  <script>
    function login() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const msgDiv = document.getElementById('msg');
      const btn = document.querySelector('.btn.primary');

      if (!username || !password) {
        msgDiv.textContent = 'Please enter both fields.';
        return;
      }

      // Simulate login - replace with real authentication
      btn.classList.add('loading');
      setTimeout(() => {
        btn.classList.remove('loading');
        // Store user info in localStorage for demo
        localStorage.setItem('userId', '1');
        localStorage.setItem('name', username.split('@')[0] || 'User');
        localStorage.setItem('email', username);
        window.location.href = './app.html';
      }, 1000);
    }

    function forgotPassword() {
      alert('Password reset link sent to your email (demo).');
    }

    function createAccount() {
      alert('Redirect to signup page (demo).');
    }
  </script>
</body>
</html>
