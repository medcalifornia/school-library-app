<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <title>Health Tracker</title>
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

  <div class="topbar">
    <h2>Health Tracker</h2>
    <div class="topbar-right">
      <span id="hello" class="muted"></span>
      <button class="btn-inline" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="card">
    <h3>Add Glucose</h3>
    <div class="grid3">
      <input id="gVal" placeholder="Glucose mg/dL (e.g. 110)" inputmode="numeric" />
      <select id="gNote">
        <option value="">(Choose note)</option>
        <option>Fasting (morning)</option>
        <option>Before breakfast</option>
        <option>After breakfast</option>
        <option>Before lunch</option>
        <option>After lunch</option>
        <option>Before dinner</option>
        <option>After dinner</option>
        <option>Before sleep</option>
      </select>
      <button onclick="saveGlucose()">Save Glucose</button>
    </div>
  </div>

  <div class="card">
    <h3>Add Blood Pressure</h3>
    <div class="grid3">
      <input id="bpSys" placeholder="Systolic (e.g. 120)" inputmode="numeric" />
      <input id="bpDia" placeholder="Diastolic (e.g. 80)" inputmode="numeric" />
      <select id="bpNote">
        <option value="">(Choose note)</option>
        <option>Resting</option>
        <option>After walking</option>
        <option>After exercise</option>
        <option>Before sleep</option>
        <option>After coffee</option>
        <option>Feeling dizzy</option>
      </select>
    </div>
    <button onclick="saveBP()">Save Blood Pressure</button>
  </div>

  <div class="card">
    <h3>My Readings</h3>
    <button onclick="loadAll()">Load My Readings</button>

    <div class="tableWrap">
      <table>
        <thead>
          <tr>
            <th>Date/Time</th>
            <th>Type</th>
            <th>Value</th>
            <th>Note</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h3>Chart</h3>
    <div class="chartWrap">
      <canvas id="chart" height="140"></canvas>
    </div>
  </div>

</div>

<script>
const userId = localStorage.getItem("userId");
if (!userId) location.href = "/index.html";

hello.textContent = "Hello, " + (localStorage.getItem("name") || "");

function logout(){
  localStorage.removeItem("userId");
  localStorage.removeItem("name");
  localStorage.removeItem("email");
  location.href = "/index.html";
}

async function saveGlucose(){
  const v = gVal.value.trim();
  if (!v) return alert("Enter glucose value");

  await fetch("/api/readings", {
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      userId,
      type: "glucose",
      value: v,
      note: gNote.value
    })
  });

  gVal.value = "";
  gNote.value = "";
  loadAll();
}

async function saveBP(){
  const s = bpSys.value.trim();
  const d = bpDia.value.trim();
  if (!s || !d) return alert("Enter systolic and diastolic");

  await fetch("/api/readings", {
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      userId,
      type: "bp",
      value: `${s}/${d}`,
      note: bpNote.value
    })
  });

  bpSys.value = "";
  bpDia.value = "";
  bpNote.value = "";
  loadAll();
}

async function loadAll(){
  const res = await fetch(`/api/readings/${userId}`);
  const data = await res.json();

  rows.innerHTML = "";
  for (const r of data.slice().reverse()) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${new Date(r.ts).toLocaleString()}</td>
      <td>${r.type === "bp" ? "Blood Pressure" : "Glucose"}</td>
      <td>${r.value}</td>
      <td>${r.note || ""}</td>
    `;
    rows.appendChild(tr);
  }

  await loadChart();
}

let chartObj = null;
async function loadChart(){
  const res = await fetch(`/api/chart/${userId}`);
  const data = await res.json();

  const ctx = document.getElementById("chart");
  if (chartObj) chartObj.destroy();

  chartObj = new Chart(ctx, {
    type: "line",
    data: {
      labels: data.labels,
      datasets: [
        { label: "Glucose Avg", data: data.glucoseAvg },
        { label: "BP Systolic Avg", data: data.sysAvg },
        { label: "BP Diastolic Avg", data: data.diaAvg }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false
    }
  });
}

loadAll();
</script>

</body>
</html>
