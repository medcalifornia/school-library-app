<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <title>Health Tracker</title>

  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container container-wide">

  <h2>Health Tracker</h2>

  <!-- TOP BAR (Date/Time + Hello + Email + Buttons) -->
  <div class="topbar">
    <div class="badgesRow">

      <!-- Date & Time -->
      <div class="badge" title="Current date & time">
        <span class="badgeIcon">🕒</span>
        <span class="badgeText">
          <span id="dateLine"></span>
          <small id="timeLine"></small>
        </span>
      </div>

      <!-- Hello -->
      <div class="badge" title="Current user">
        <span class="badgeIcon">👋</span>
        <span class="badgeText">
          <span id="helloLine"></span>
          <small>Welcome back</small>
        </span>
      </div>

      <!-- Email -->
      <div class="badge" title="Account email">
        <span class="badgeIcon">📧</span>
        <span class="badgeText">
          <span id="emailLine"></span>
          <small>Account</small>
        </span>
      </div>

    </div>

    <div class="topActions">
      <button type="button" class="btn-secondary" onclick="loadAll()">Refresh</button>
      <button type="button" onclick="logout()">Logout</button>
    </div>
  </div>

  <!-- ADD GLUCOSE -->
  <div class="card">
    <h3>Add Glucose</h3>
    <div class="grid3">
      <input id="gVal" placeholder="Glucose mg/dL (e.g. 110)" inputmode="numeric" />
      <select id="gNote">
        <option value="">(Choose note)</option>
        <option>Fasting (morning)</option>
        <option>Before breakfast</option>
        <option>After breakfast</option>
        <option>Before lunch</option>
        <option>After lunch</option>
        <option>Before dinner</option>
        <option>After dinner</option>
        <option>Before sleep</option>
      </select>
      <button onclick="saveGlucose()">Save Glucose</button>
    </div>
  </div>

  <!-- ADD BLOOD PRESSURE -->
  <div class="card">
    <h3>Add Blood Pressure</h3>
    <div class="grid3">
      <input id="bpSys" placeholder="Systolic (e.g. 120)" inputmode="numeric" />
      <input id="bpDia" placeholder="Diastolic (e.g. 80)" inputmode="numeric" />
      <select id="bpNote">
        <option value="">(Choose note)</option>
        <option>Resting</option>
        <option>After walking</option>
        <option>After exercise</option>
        <option>Before sleep</option>
        <option>After coffee</option>
        <option>Feeling dizzy</option>
      </select>
    </div>
    <button onclick="saveBP()">Save Blood Pressure</button>
  </div>

  <!-- READINGS -->
  <div class="card">
    <h3>My Readings</h3>
    <button class="btn-secondary" onclick="loadAll()">Load My Readings</button>

    <div class="tableWrap">
      <table>
        <thead>
          <tr>
            <th>Date/Time</th>
            <th>Type</th>
            <th>Value</th>
            <th>Note</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <!-- CHART -->
  <div class="card">
    <h3>Chart</h3>
    <div class="chartWrap">
      <canvas id="chart" height="140"></canvas>
    </div>
  </div>

</div>

<script>
/* ================= AUTH CHECK ================= */
const userId = localStorage.getItem("userId");
if (!userId) location.href = "/index.html";

const userName  = (localStorage.getItem("name") || "").trim();
const userEmail = (localStorage.getItem("email") || "").trim();

/* ================= UI HELPERS ================= */
function maskEmail(email){
  if(!email || !email.includes("@")) return email || "";
  const [name, domain] = email.split("@");
  if(name.length <= 2) return name + "****@" + domain;
  return name.slice(0,2) + "****@" + domain;
}

function updateClock(){
  const now = new Date();
  const dateStr = now.toLocaleDateString(undefined, { weekday:"long", year:"numeric", month:"short", day:"numeric" });
  const timeStr = now.toLocaleTimeString(undefined, { hour:"2-digit", minute:"2-digit", second:"2-digit" });

  document.getElementById("dateLine").textContent = dateStr;
  document.getElementById("timeLine").textContent = timeStr;
}

document.getElementById("helloLine").textContent = "Hello, " + (userName || "User");
document.getElementById("emailLine").textContent = maskEmail(userEmail);

updateClock();
setInterval(updateClock, 1000);

/* ================= LOGOUT ================= */
function logout(){
  localStorage.removeItem("userId");
  localStorage.removeItem("name");
  localStorage.removeItem("email");
  location.href = "/index.html";
}

/* ================= API CALLS ================= */
async function saveGlucose(){
  const v = gVal.value.trim();
  if (!v) return alert("Enter glucose value");

  await fetch("/api/readings", {
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      userId,
      type: "glucose",
      value: v,
      note: gNote.value
    })
  });

  gVal.value = "";
  gNote.value = "";
  loadAll();
}

async function saveBP(){
  const s = bpSys.value.trim();
  const d = bpDia.value.trim();
  if (!s || !d) return alert("Enter systolic and diastolic");

  await fetch("/api/readings", {
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      userId,
      type: "bp",
      value: `${s}/${d}`,
      note: bpNote.value
    })
  });

  bpSys.value = "";
  bpDia.value = "";
  bpNote.value = "";
  loadAll();
}

async function loadAll(){
  const res = await fetch(`/api/readings/${userId}`);
  const data = await res.json();

  rows.innerHTML = "";
  for (const r of data.slice().reverse()) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${new Date(r.ts).toLocaleString()}</td>
      <td>${r.type === "bp" ? "Blood Pressure" : "Glucose"}</td>
      <td>${r.value}</td>
      <td>${r.note || ""}</td>
    `;
    rows.appendChild(tr);
  }

  await loadChart();
}

let chartObj = null;
async function loadChart(){
  const res = await fetch(`/api/chart/${userId}`);
  const data = await res.json();

  const ctx = document.getElementById("chart");
  if (chartObj) chartObj.destroy();

  chartObj = new Chart(ctx, {
    type: "line",
    data: {
      labels: data.labels,
      datasets: [
        { label: "Glucose Avg", data: data.glucoseAvg },
        { label: "BP Systolic Avg", data: data.sysAvg },
        { label: "BP Diastolic Avg", data: data.diaAvg }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false
    }
  });
}

loadAll();
</script>

</body>
</html>
