<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Health Tracker - Login</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    /* إزالة أي شريط أزرق سفلي */
    body.login-page {
      background: var(--bg);
    }
    .app-footer {
      border-top: none;
      background: transparent;
    }
  </style>
</head>

<body class="login-page">

  <main class="login-wrap">
    <section class="card login-card" aria-label="Login">

      <header class="login-head">
        <div class="brand-row">
          <img src="./images/logo.png" alt="DahniTech Logo" class="brand-logo">
          <h1 class="login-title">Health Tracker</h1>
        </div>
        <p class="muted">Sign in to your account</p>
      </header>

      <form class="login-form" onsubmit="event.preventDefault(); login();" novalidate>
        <label class="field">
          <span class="label">Email</span>
          <input
            id="email"
            type="email"
            placeholder="name@example.com"
            autocomplete="email"
            autocapitalize="none"
            spellcheck="false"
            inputmode="email"
            required
          />
        </label>

        <label class="field">
          <span class="label">Password</span>
          <input
            id="password"
            type="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
        </label>

        <button id="loginBtn" class="btn primary" type="submit">
          <span class="btn-text">Login</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>

      <nav class="links-pro" aria-label="Account links">
        <a class="link-btn" href="./register.html">Create account</a>
        <a class="link-btn link-ghost" href="./forgot.html">Forgot password?</a>
      </nav>

      <div id="msg" class="msg" role="status" aria-live="polite"></div>

      <div class="hero-image" aria-hidden="true">
        <img src="./images/health-app.jpg" alt="Health Tracker Dashboard Preview">
      </div>

    </section>
  </main>

  <footer class="app-footer">
    <div class="footer-inner">
      <p>© 2026 El Mehdi Dahni · DahniTech Solutions</p>
      <p>Health Tracker – Beta Version</p>
      <p class="footer-small">Developed as a personal academic project at Cerritos College.</p>
    </div>
  </footer>

<script>
  (function() {
    "use strict";
    
    const $ = id => document.getElementById(id);
    
    function setLoading(btn, isLoading) {
      if (btn) {
        btn.classList.toggle("loading", !!isLoading);
        btn.disabled = !!isLoading;
      }
    }

    window.login = async function() {
      const email = $("email")?.value.trim();
      const password = $("password")?.value;
      const btn = $("loginBtn");
      const msg = $("msg");

      if (!email || !password) {
        msg.textContent = "Please enter email and password.";
        return;
      }

      setLoading(btn, true);
      msg.textContent = "";

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          msg.textContent = data.error || "Login failed. Check your credentials.";
          return;
        }

        // Store auth data
        localStorage.setItem("userId", data.userId);
        localStorage.setItem("name", data.name || "");
        localStorage.setItem("phone", data.phone || "");
        localStorage.setItem("email", email);

        window.location.href = "./app.html";
      } catch (err) {
        msg.textContent = "Network error. Please try again.";
      } finally {
        setLoading(btn, false);
      }
    };
  })();
</script>

</body>
</html>
