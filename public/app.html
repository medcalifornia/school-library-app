<!-- app.html -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Health Tracker</title>

  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="header">
  <div class="header-left">
    <h1 class="app-title">Health Tracker</h1>
    <div class="header-info">
      <span id="hello"></span>
      <span class="sep">•</span>
      <span id="now"></span>
    </div>
  </div>

  <button class="btn btn-logout" onclick="logout()">Logout</button>
</div>

<div class="container container-wide">

  <div class="card">
    <h3>Add Glucose</h3>

    <div class="grid3">
      <input id="gVal" placeholder="Glucose mg/dL (e.g. 110)" inputmode="numeric" />
      <select id="gNote">
        <option value="">(Choose note)</option>
        <option>Fasting (morning)</option>
        <option>Before breakfast</option>
        <option>After breakfast</option>
        <option>Before lunch</option>
        <option>After lunch</option>
        <option>Before dinner</option>
        <option>After dinner</option>
        <option>Before sleep</option>
      </select>

      <div class="btn-row">
        <button id="gSaveBtn" class="btn" onclick="saveGlucose()">Save Glucose</button>
        <button id="gCancelBtn" class="btn btn-ghost" onclick="cancelEdit()" style="display:none;">Cancel</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h3>Add Blood Pressure</h3>

    <div class="grid3">
      <input id="bpSys" placeholder="Systolic (e.g. 120)" inputmode="numeric" />
      <input id="bpDia" placeholder="Diastolic (e.g. 80)" inputmode="numeric" />
      <select id="bpNote">
        <option value="">(Choose note)</option>
        <option>Resting</option>
        <option>After walking</option>
        <option>After exercise</option>
        <option>Before sleep</option>
        <option>After coffee</option>
        <option>Feeling dizzy</option>
      </select>
    </div>

    <div class="btn-row">
      <button id="bpSaveBtn" class="btn" onclick="saveBP()">Save Blood Pressure</button>
      <button id="bpCancelBtn" class="btn btn-ghost" onclick="cancelEdit()" style="display:none;">Cancel</button>
    </div>
  </div>

  <!-- ✅ Chart FIRST -->
  <div class="card">
    <h3>Chart</h3>
    <canvas id="chart" height="120"></canvas>
  </div>

  <!-- ✅ My Readings AFTER Chart -->
  <div class="card">
    <div class="row-between">
      <h3>My Readings</h3>
      <button class="btn btn-small" onclick="loadAll()">Refresh</button>
    </div>

    <table class="readings">
      <thead>
        <tr>
          <th>Date/Time</th>
          <th>Type</th>
          <th>Value</th>
          <th>Note</th>
          <th class="th-actions">Actions</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <div class="legend">
      <div><span class="dot ok"></span> Normal</div>
      <div><span class="dot warn"></span> Elevated / Prediabetes</div>
      <div><span class="dot bad"></span> High</div>
    </div>

    <!-- ✅ Pagination (NO showing text) -->
    <div id="pagination" class="pager"></div>
  </div>

</div>

<script>
const userId = localStorage.getItem("userId");
if (!userId) location.href = "/index.html";

hello.textContent = "Hello, " + (localStorage.getItem("name") || "");

// ===== Live Date/Time =====
function updateNow(){
  now.textContent = new Date().toLocaleString();
}
updateNow();
setInterval(updateNow, 1000);

// ===== Logout =====
function logout(){
  localStorage.removeItem("userId");
  localStorage.removeItem("name");
  localStorage.removeItem("email");
  location.href = "/index.html";
}

/* ===== Coloring Functions ===== */

// Glucose: <100 green, 100-125 orange, >=126 red
function glucoseClass(v){
  const n = Number(v);
  if (Number.isNaN(n)) return "";
  if (n < 100) return "glucose-low";
  if (n <= 125) return "glucose-mid";
  return "glucose-high";
}

// BP: Normal green, Elevated orange, High red (ACC/AHA)
function bpHtml(v){
  const parts = String(v).split("/");
  const s = Number(parts[0]);
  const d = Number(parts[1]);

  if (Number.isNaN(s) || Number.isNaN(d)) return String(v);

  let cls = "bp-low"; // Normal
  if (s >= 120 && s <= 129 && d < 80) cls = "bp-mid"; // Elevated
  if (s >= 130 || d >= 80) cls = "bp-high"; // High

  return `<span class="${cls}">${s}/${d}</span>`;
}

/* ===== Edit State ===== */
let editing = null; // { id, type }

/* ===== Save / Update ===== */

async function saveGlucose(){
  const v = gVal.value.trim();
  if (!v) return alert("Enter glucose value");

  // update mode
  if (editing && editing.type === "glucose"){
    const res = await fetch(`/api/readings/${editing.id}`,{
      method:"PUT",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ userId, value: v, note: gNote.value })
    });
    const data = await res.json().catch(()=>({}));
    if (!res.ok) return alert(data.error || "Update failed");
    cancelEdit();
    await loadAll();
    return;
  }

  // create mode
  await fetch("/api/readings", {
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ userId, type:"glucose", value:v, note:gNote.value })
  });

  gVal.value = "";
  gNote.value = "";
  loadAll();
}

async function saveBP(){
  const s = bpSys.value.trim();
  const d = bpDia.value.trim();
  if (!s || !d) return alert("Enter systolic and diastolic");

  const value = `${s}/${d}`;

  // update mode
  if (editing && editing.type === "bp"){
    const res = await fetch(`/api/readings/${editing.id}`,{
      method:"PUT",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ userId, value, note: bpNote.value })
    });
    const data = await res.json().catch(()=>({}));
    if (!res.ok) return alert(data.error || "Update failed");
    cancelEdit();
    await loadAll();
    return;
  }

  // create mode
  await fetch("/api/readings", {
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ userId, type:"bp", value, note: bpNote.value })
  });

  bpSys.value = "";
  bpDia.value = "";
  bpNote.value = "";
  loadAll();
}

function cancelEdit(){
  editing = null;

  // reset buttons / cancel visibility
  gSaveBtn.textContent = "Save Glucose";
  bpSaveBtn.textContent = "Save Blood Pressure";
  gCancelBtn.style.display = "none";
  bpCancelBtn.style.display = "none";

  // clear inputs
  gVal.value = "";
  gNote.value = "";
  bpSys.value = "";
  bpDia.value = "";
  bpNote.value = "";
}

/* ===== Table Helpers ===== */

function fmtType(t){
  return t === "bp" ? "Blood Pressure" : "Glucose";
}

function fmtValue(r){
  if (r.type === "glucose"){
    const cls = glucoseClass(r.value);
    return `<span class="${cls}">${r.value}</span>`;
  }
  return bpHtml(r.value);
}

/* ===== Pagination State ===== */
const pageSize = 10;
let currentPage = 1;
let allReadings = []; // newest first
let byId = {};        // id -> reading

function renderPage(){
  rows.innerHTML = "";

  const total = allReadings.length;
  const totalPages = Math.max(1, Math.ceil(total / pageSize));
  currentPage = Math.min(Math.max(1, currentPage), totalPages);

  const start = (currentPage - 1) * pageSize;
  const pageItems = allReadings.slice(start, start + pageSize);

  for (const r of pageItems) {
    const dt = new Date(r.ts).toLocaleString();
    const tr = document.createElement("tr");

    if (r.type === "glucose") tr.classList.add("row-glucose");
    if (r.type === "bp") tr.classList.add("row-bp");

    tr.innerHTML = `
      <td data-label="Date/Time">${dt}</td>
      <td data-label="Type">${fmtType(r.type)}</td>
      <td data-label="Value">${fmtValue(r)}</td>
      <td data-label="Note">${r.note || ""}</td>
      <td data-label="Actions">
        <div class="actions">
          <button class="icon-btn edit" data-id="${r.id}" type="button">Edit</button>
          <button class="icon-btn del" data-id="${r.id}" type="button">Delete</button>
        </div>
      </td>
    `;
    rows.appendChild(tr);
  }

  // bind actions
  rows.querySelectorAll(".icon-btn.edit").forEach(btn=>{
    btn.addEventListener("click", ()=> startEdit(btn.dataset.id));
  });
  rows.querySelectorAll(".icon-btn.del").forEach(btn=>{
    btn.addEventListener("click", ()=> deleteReading(btn.dataset.id));
  });

  renderPagination(totalPages);
}

function renderPagination(totalPages){
  const paginationDiv = document.getElementById("pagination");
  paginationDiv.innerHTML = "";
  if (totalPages <= 1) return;

  const prev = document.createElement("button");
  prev.className = "pager-btn";
  prev.textContent = "Prev";
  prev.disabled = currentPage === 1;
  prev.onclick = () => { currentPage--; renderPage(); };
  paginationDiv.appendChild(prev);

  const pages = [];
  if (totalPages <= 7){
    for (let i = 1; i <= totalPages; i++) pages.push(i);
  } else {
    pages.push(1);
    let s = Math.max(2, currentPage - 2);
    let e = Math.min(totalPages - 1, currentPage + 2);

    if (s > 2) pages.push("...");
    for (let i = s; i <= e; i++) pages.push(i);
    if (e < totalPages - 1) pages.push("...");
    pages.push(totalPages);
  }

  for (const p of pages){
    if (p === "..."){
      const span = document.createElement("span");
      span.className = "pager-dots";
      span.textContent = "…";
      paginationDiv.appendChild(span);
      continue;
    }
    const btn = document.createElement("button");
    btn.className = "pager-num" + (p === currentPage ? " active" : "");
    btn.textContent = String(p);
    btn.onclick = () => { currentPage = p; renderPage(); };
    paginationDiv.appendChild(btn);
  }

  const next = document.createElement("button");
  next.className = "pager-btn";
  next.textContent = "Next";
  next.disabled = currentPage === totalPages;
  next.onclick = () => { currentPage++; renderPage(); };
  paginationDiv.appendChild(next);
}

/* ===== Edit/Delete Actions ===== */

function startEdit(id){
  const r = byId[id];
  if (!r) return;

  editing = { id: r.id, type: r.type };

  if (r.type === "glucose"){
    gVal.value = r.value;
    gNote.value = r.note || "";
    gSaveBtn.textContent = "Update Glucose";
    gCancelBtn.style.display = "inline-flex";

    // make sure BP cancel visible too (so user can cancel easily)
    bpCancelBtn.style.display = "none";
  } else {
    const parts = String(r.value).split("/");
    bpSys.value = parts[0] || "";
    bpDia.value = parts[1] || "";
    bpNote.value = r.note || "";
    bpSaveBtn.textContent = "Update Blood Pressure";
    bpCancelBtn.style.display = "inline-flex";

    gCancelBtn.style.display = "none";
  }

  // scroll to top nicely
  window.scrollTo({ top: 0, behavior: "smooth" });
}

async function deleteReading(id){
  const r = byId[id];
  if (!r) return;

  const label = r.type === "bp" ? `Blood Pressure (${r.value})` : `Glucose (${r.value})`;
  if (!confirm(`Delete this reading?\n${label}`)) return;

  const res = await fetch(`/api/readings/${id}`,{
    method:"DELETE",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ userId })
  });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) return alert(data.error || "Delete failed");

  // if you deleted item being edited
  if (editing && editing.id === id) cancelEdit();

  await loadAll();
}

/* ===== Load All Readings ===== */

async function loadAll(){
  const res = await fetch(`/api/readings/${userId}`);
  const data = await res.json();

  allReadings = (Array.isArray(data) ? data : []).slice().reverse(); // newest first

  byId = {};
  for (const r of allReadings) byId[r.id] = r;

  const totalPages = Math.max(1, Math.ceil(allReadings.length / pageSize));
  if (currentPage > totalPages) currentPage = totalPages;
  if (currentPage < 1) currentPage = 1;

  renderPage();
  await loadChart();
}

/* ===== Chart ===== */

let chartObj = null;

async function loadChart(){
  const res = await fetch(`/api/chart/${userId}`);
  const data = await res.json();

  const ctx = document.getElementById("chart");
  if (chartObj) chartObj.destroy();

  chartObj = new Chart(ctx, {
    type: "line",
    data: {
      labels: data.labels,
      datasets: [
        { label: "Glucose Avg", data: data.glucoseAvg },
        { label: "BP Systolic Avg", data: data.sysAvg },
        { label: "BP Diastolic Avg", data: data.diaAvg }
      ]
    }
  });
}

loadAll();
</script>

</body>
</html>
