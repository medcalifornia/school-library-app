<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Health Tracker - Login/Register</title>
  <style>
    body { font-family: Arial; max-width: 720px; margin: 20px auto; padding: 20px; }
    input, select { width: 100%; padding: 10px; margin: 6px 0; }
    button { padding: 10px 14px; margin-top: 8px; cursor: pointer; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .card { border: 1px solid #ddd; padding: 14px; border-radius: 10px; }
    .msg { margin-top: 10px; }
  </style>
</head>
<body>
  <h2>Health Tracker</h2>

  <div class="row">
    <div class="card">
      <h3>Register</h3>
      <input id="rName" placeholder="Full name" />
      <input id="rEmail" placeholder="Email" />
      <input id="rPhone" placeholder="+15625416709" />
      <input id="rPass" placeholder="Password" type="password" />
      <button onclick="register()">Register</button>
      <div class="msg" id="rMsg"></div>
    </div>

    <div class="card">
      <h3>Login</h3>
      <input id="lEmail" placeholder="Email" />
      <input id="lPass" placeholder="Password" type="password" />
      <button onclick="login()">Login</button>

      <hr />

      <h3>Forgot Password (SMS)</h3>
      <input id="fpPhone" placeholder="+15625416709" />
      <button onclick="sendReset()">Send Code</button>

      <input id="fpCode" placeholder="6-digit code" />
      <button onclick="verifyCode()">Verify Code</button>

      <input id="fpNewPass" placeholder="New password" type="password" />
      <button onclick="resetPass()">Reset Password</button>

      <div class="msg" id="lMsg"></div>
    </div>
  </div>

<script>
async function register() {
  const body = {
    name: rName.value,
    email: rEmail.value,
    phone: rPhone.value,
    password: rPass.value
  };
  const res = await fetch("/api/register", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(body)
  });
  const data = await res.json();
  rMsg.textContent = data.message || data.error || "Done";
}

async function login() {
  const body = { email: lEmail.value, password: lPass.value };
  const res = await fetch("/api/login", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if (data.userId) {
    localStorage.setItem("userId", data.userId);
    localStorage.setItem("name", data.name || "");
    location.href = "/app.html";
  } else {
    lMsg.textContent = data.error || "Login failed";
  }
}

async function sendReset() {
  const res = await fetch("/api/forgot-password", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ phone: fpPhone.value })
  });
  const data = await res.json();
  lMsg.textContent = data.message || data.error || "";
}

async function verifyCode() {
  const res = await fetch("/api/verify-reset-code", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ phone: fpPhone.value, code: fpCode.value })
  });
  const data = await res.json();
  lMsg.textContent = data.message || data.error || "";
}

async function resetPass() {
  const res = await fetch("/api/reset-password", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ phone: fpPhone.value, newPassword: fpNewPass.value })
  });
  const data = await res.json();
  lMsg.textContent = data.message || data.error || "";
}
</script>

</body>
</html>
