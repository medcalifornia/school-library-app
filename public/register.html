<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Health Tracker - Register</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body class="login-page">

  <main class="login-wrap">
    <section class="card login-card" aria-label="Register">

      <header class="login-head">
        <div class="brand-row">
          <img src="./images/logo.png" alt="DahniTech Logo" class="brand-logo">
          <h2 class="login-title">Create Account</h2>
        </div>
        <p class="muted">Create your account to start tracking.</p>
      </header>

      <form id="registerForm" class="login-form" novalidate>
        <label class="field">
          <span class="label">Full name</span>
          <input id="rName" placeholder="Your name" autocomplete="name" required />
        </label>

        <label class="field">
          <span class="label">Email</span>
          <input id="rEmail" placeholder="name@example.com" type="email" autocomplete="email" autocapitalize="none" required />
        </label>

        <label class="field">
          <span class="label">Phone</span>
          <input id="rPhone" placeholder="+15625551234" inputmode="tel" autocomplete="tel" required />
        </label>

        <label class="field">
          <span class="label">Password</span>
          <input id="rPass" placeholder="Minimum 8 characters" type="password" autocomplete="new-password" required />
        </label>

        <button id="rBtn" class="btn primary" type="submit">
          <span class="btn-text">Register</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </form>

      <div id="rMsg" class="msg" role="status" aria-live="polite"></div>

      <nav class="links-pro" aria-label="Back to login">
        <a class="link-btn link-ghost" href="./index.html">← Back to Login</a>
      </nav>

    </section>
  </main>

<script>
  const rForm = document.getElementById("registerForm");
  const rBtn  = document.getElementById("rBtn");
  const rMsg  = document.getElementById("rMsg");

  function setLoading(btn, isLoading){
    btn.classList.toggle("loading", !!isLoading);
    btn.disabled = !!isLoading;
  }

  function normalizePhone(p){
    p = (p || "").trim();
    if (!p) return "";
    return p.startsWith("+") ? p : ("+" + p);
  }

  function showMsg(text, isErr=false){
    rMsg.className = "msg";
    rMsg.style.color = isErr ? "var(--danger)" : "rgba(255,255,255,0.85)";
    rMsg.textContent = text || "";
  }

  rForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    showMsg("");
    const body = {
      name: document.getElementById("rName").value.trim(),
      email: document.getElementById("rEmail").value.trim().toLowerCase(),
      phone: normalizePhone(document.getElementById("rPhone").value),
      password: document.getElementById("rPass").value
    };

    if (!body.name || !body.email || !body.phone || !body.password) {
      return showMsg("Please fill all fields.", true);
    }
    if (body.password.length < 8) {
      return showMsg("Password must be at least 8 characters.", true);
    }

    try {
      setLoading(rBtn, true);

      const res = await fetch("/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body)
      });

      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        return showMsg(data.error || "Registration failed.", true);
      }

      showMsg("Registered successfully ✅ Redirecting to login...");
      setTimeout(() => window.location.href = "./index.html", 900);

    } catch (err) {
      showMsg("Network error.", true);
    } finally {
      setLoading(rBtn, false);
    }
  });
</script>

</body>
</html>
