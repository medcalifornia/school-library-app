<!DOCTYPE html>
<html>
<head>
  <title>Health Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial; max-width: 900px; margin: auto; padding: 20px; }
    input, select { padding: 6px; margin: 5px; }
    button { padding: 6px 12px; margin: 5px; }
    table { width: 100%; margin-top: 20px; border-collapse: collapse; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    th { background: #f2f2f2; }
    canvas { margin-top: 30px; }
    hr { margin: 25px 0; }
  </style>
</head>
<body>

<h2>Health Tracker</h2>

<!-- ================= GLUCOSE ================= -->

<h3>Add Glucose</h3>

<input type="number" id="glucoseValue" placeholder="Glucose mg/dL (e.g. 110)">

<select id="glucoseNote">
  <option value="">Select Note (optional)</option>
  <option value="Fasting Morning">Fasting Morning</option>
  <option value="Before Breakfast">Before Breakfast</option>
  <option value="After Breakfast">After Breakfast</option>
  <option value="Before Lunch">Before Lunch</option>
  <option value="After Lunch">After Lunch</option>
  <option value="Before Dinner">Before Dinner</option>
  <option value="After Dinner">After Dinner</option>
  <option value="Bedtime">Bedtime</option>
</select>

<button onclick="addGlucose()">Save Glucose</button>

<hr>

<!-- ================= BLOOD PRESSURE ================= -->

<h3>Add Blood Pressure</h3>

<input type="number" id="systolic" placeholder="Systolic (e.g. 120)">
<input type="number" id="diastolic" placeholder="Diastolic (e.g. 80)">

<select id="bpNote">
  <option value="">Select Note (optional)</option>
  <option value="Before Medication">Before Medication</option>
  <option value="After Medication">After Medication</option>
  <option value="Morning">Morning</option>
  <option value="Afternoon">Afternoon</option>
  <option value="Evening">Evening</option>
  <option value="Before Sleep">Before Sleep</option>
</select>

<button onclick="addBP()">Save Blood Pressure</button>

<hr>

<!-- ================= TABLE ================= -->

<h3>My Readings</h3>

<table>
  <thead>
    <tr>
      <th>Date & Time</th>
      <th>Type</th>
      <th>Value</th>
      <th>Note</th>
    </tr>
  </thead>
  <tbody id="readingsTable"></tbody>
</table>

<!-- ================= CHARTS ================= -->

<h3>Glucose Chart</h3>
<canvas id="glucoseChart"></canvas>

<h3>Blood Pressure Chart</h3>
<canvas id="bpChart"></canvas>

<script>

let readings = JSON.parse(localStorage.getItem("readings")) || [];

function saveData() {
  localStorage.setItem("readings", JSON.stringify(readings));
}

function getNow() {
  return new Date().toLocaleString();
}

function addGlucose() {
  const value = document.getElementById("glucoseValue").value;
  const note = document.getElementById("glucoseNote").value;

  if (!value) return alert("Enter glucose value");

  readings.push({
    date: getNow(),
    type: "glucose",
    value: value,
    note: note
  });

  saveData();
  render();
}

function addBP() {
  const sys = document.getElementById("systolic").value;
  const dia = document.getElementById("diastolic").value;
  const note = document.getElementById("bpNote").value;

  if (!sys || !dia) return alert("Enter blood pressure values");

  readings.push({
    date: getNow(),
    type: "bp",
    value: sys + "/" + dia,
    note: note
  });

  saveData();
  render();
}

function render() {

  const table = document.getElementById("readingsTable");
  table.innerHTML = "";

  readings.forEach(r => {
    table.innerHTML += `
      <tr>
        <td>${r.date}</td>
        <td>${r.type}</td>
        <td>${r.value}</td>
        <td>${r.note || ""}</td>
      </tr>
    `;
  });

  renderCharts();
}

function renderCharts() {

  const glucoseData = readings.filter(r => r.type === "glucose");
  const bpData = readings.filter(r => r.type === "bp");

  const glucoseLabels = glucoseData.map(r => r.date);
  const glucoseValues = glucoseData.map(r => r.value);

  const bpLabels = bpData.map(r => r.date);
  const bpValues = bpData.map(r => parseInt(r.value.split("/")[0]));

  if (window.glucoseChartInstance) window.glucoseChartInstance.destroy();
  if (window.bpChartInstance) window.bpChartInstance.destroy();

  window.glucoseChartInstance = new Chart(
    document.getElementById("glucoseChart"),
    {
      type: "line",
      data: {
        labels: glucoseLabels,
        datasets: [{
          label: "Glucose mg/dL",
          data: glucoseValues,
          borderColor: "blue",
          fill: false
        }]
      }
    }
  );

  window.bpChartInstance = new Chart(
    document.getElementById("bpChart"),
    {
      type: "line",
      data: {
        labels: bpLabels,
        datasets: [{
          label: "Systolic BP",
          data: bpValues,
          borderColor: "red",
          fill: false
        }]
      }
    }
  );
}

render();

</script>

</body>
</html>
