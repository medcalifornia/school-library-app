<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Register - Diabetes Tracker</title>
  <style>
    body{font-family:Arial;margin:24px;background:#f6f7fb}
    .card{max-width:520px;background:#fff;padding:18px;border-radius:12px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
    input{width:100%;padding:10px;margin:8px 0}
    button{padding:10px 14px;cursor:pointer}
    pre{background:#111;color:#0f0;padding:10px;border-radius:10px;overflow:auto}
    .small{font-size:12px;opacity:.75}
  </style>
</head>
<body>
  <div class="card">
    <h2>Create Account</h2>
    <p class="small">After you register, you will receive a 6-digit SMS code.</p>

    <input id="name" placeholder="Full name" />
    <input id="email" placeholder="Email" />
    <input id="phone" placeholder='Phone (SMS) like +15625551234' />
    <input id="pass" type="password" placeholder="Password (6+)" />

    <button onclick="register()">Register</button>
    <pre id="out">...</pre>
  </div>

<script>
  async function register(){
    const body = {
      name: document.getElementById("name").value,
      email: document.getElementById("email").value,
      phone: document.getElementById("phone").value,
      password: document.getElementById("pass").value
    };

    const res = await fetch("/api/register", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(body)
    });

    const data = await res.json().catch(()=>({}));
    document.getElementById("out").textContent = JSON.stringify(data,null,2);

    if (data.ok) {
      // Save email for next page
      localStorage.setItem("pendingEmail", body.email);
      // Go to verify page
      window.location.href = "/verify.html";
    }
  }
</script>
</body>
</html>
