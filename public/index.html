<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 0 16px; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 16px; }
    input { width: 100%; padding: 10px; margin: 8px 0; }
    button { padding: 10px 14px; cursor: pointer; }
    pre { background: #f6f6f6; padding: 12px; border-radius: 10px; overflow:auto; }
  </style>
</head>
<body>
  <h2>Register</h2>

  <div class="card">
    <input id="name" placeholder="Full name" />
    <input id="email" placeholder="Email" />
    <input id="phone" placeholder="Phone (SMS) e.g. +15625551234 or 5625551234" />
    <input id="pass" type="password" placeholder="Password" />
    <button onclick="register()">Register</button>
    <pre id="out"></pre>
  </div>

<script>
async function register(){
  const body = {
    name: document.getElementById("name").value.trim(),
    email: document.getElementById("email").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    password: document.getElementById("pass").value
  };

  const res = await fetch("/api/register", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(body)
  });

  const data = await res.json().catch(()=>({}));
  document.getElementById("out").textContent = JSON.stringify(data, null, 2);

  if (data.ok) {
    // Save for verify page
    localStorage.setItem("pendingEmail", body.email);
    localStorage.setItem("pendingPhone", body.phone);
    window.location.href = "/verify.html";
  }
}
</script>
</body>
</html>
