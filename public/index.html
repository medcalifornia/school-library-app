<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>School Library Web App</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    button { padding: 10px 14px; margin-right: 10px; cursor: pointer; }
    pre { background: #111; color: #0f0; padding: 12px; border-radius: 8px; overflow:auto; }
    .card { padding: 16px; border: 1px solid #ddd; border-radius: 10px; max-width: 700px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📚 School Library Web App</h1>
    <p>This is a real web page hosted on Azure App Service.</p>

    <button onclick="loadHealth()">Test /health</button>
    <button onclick="loadBooks()">Load Books</button>

    <h3>Result:</h3>
    <pre id="out">Click a button...</pre>
  </div>

  <script>
    async function loadHealth() {
      const r = await fetch('/health');
      const data = await r.json();
      document.getElementById('out').textContent = JSON.stringify(data, null, 2);
    }

    async function loadBooks() {
      const r = await fetch('/books');
      const data = await r.json();
      document.getElementById('out').textContent = JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
