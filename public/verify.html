

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verify</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 30px auto; padding: 0 16px; }
    .card { border: 1px solid #ddd; border-radius: 12px; padding: 16px; }
    input { width: 100%; padding: 10px; margin: 8px 0; }
    button { padding: 10px 14px; cursor: pointer; }
    pre { background: #f6f6f6; padding: 12px; border-radius: 10px; overflow:auto; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 640px){ .row{ grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h2>Verify (SMS Code)</h2>

  <div class="card">
    <div class="row">
      <input id="email" placeholder="Email" />
      <input id="phone" placeholder="Phone used in registration" />
    </div>
    <input id="code" placeholder="6-digit code from SMS" />
    <button onclick="verifyCode()">Verify</button>

    <hr />

    <h3>Login</h3>
    <input id="pass" type="password" placeholder="Password" />
    <button onclick="login()">Login</button>

    <pre id="out"></pre>
  </div>

<script>
(function fill(){
  document.getElementById("email").value = localStorage.getItem("pendingEmail") || "";
  document.getElementById("phone").value = localStorage.getItem("pendingPhone") || "";
})();

async function verifyCode(){
  const body = {
    email: document.getElementById("email").value.trim(),
    phone: document.getElementById("phone").value.trim(),
    code: document.getElementById("code").value.trim()
  };

  const res = await fetch("/api/verify", {
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(body)
  });

  const data = await res.json().catch(()=>({}));
  document.getElementById("out").textContent = JSON.stringify(data, null, 2);
}

async function login(){
  const body = {
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("pass").value
  };

  const res = await fetch("/api/login", {
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(body)
  });

  const data = await res.json().catch(()=>({}));
  document.getElementById("out").textContent = JSON.stringify(data, null, 2);

  if (data.token) {
    localStorage.setItem("token", data.token);
    localStorage.removeItem("pendingEmail");
    localStorage.removeItem("pendingPhone");
    window.location.href = "/app.html";
  }
}
</script>
</body>
</html>
