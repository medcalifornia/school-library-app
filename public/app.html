<!doctype html>

<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="utf-8" />
  <title>Health Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body { font-family: Arial; max-width: 900px; margin: 20px auto; padding: 20px; }
    input, select { padding: 10px; margin: 6px 0; box-sizing: border-box; width: 100%; }
    button { padding: 10px 14px; margin-top: 8px; cursor: pointer; }
    .card { border: 1px solid #ddd; padding: 14px; border-radius: 10px; margin: 12px 0; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; align-items: end; }
    table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f2f2f2; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    @media (max-width: 860px) {
      .grid3 { grid-template-columns: 1fr; }
    }

    /* ===== Glucose Color Levels ===== */
    .glucose-low { color: #16a34a; font-weight: 700; }
    .glucose-mid { color: #f59e0b; font-weight: 700; }
    .glucose-high{ color: #dc2626; font-weight: 700; }

    /* ===== Blood Pressure Color Levels ===== */
    .bp-low { color: #16a34a; font-weight: 700; }
    .bp-mid { color: #f59e0b; font-weight: 700; }
    .bp-high{ color: #dc2626; font-weight: 700; }

    /* ===== Legend ===== */
    .legend{
      margin-top: 10px;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 14px;
      color: #333;
    }
    .legend .dot{
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 999px;
      margin-right: 6px;
      vertical-align: middle;
    }
    .legend .dot.ok{ background: #16a34a; }
    .legend .dot.warn{ background: #f59e0b; }
    .legend .dot.bad{ background: #dc2626; }
  </style>
</head>

<body>
  <div class="topbar">
    <h2>Health Tracker</h2>
    <div>
      <span id="hello"></span>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="card">
    <h3>Add Glucose</h3>
    <div class="grid3">
      <input id="gVal" placeholder="Glucose mg/dL (e.g. 110)" />
      <select id="gNote">
        <option value="">(Choose note)</option>
        <option>Fasting (morning)</option>
        <option>Before breakfast</option>
        <option>After breakfast</option>
        <option>Before lunch</option>
        <option>After lunch</option>
        <option>Before dinner</option>
        <option>After dinner</option>
        <option>Before sleep</option>
      </select>
      <button onclick="saveGlucose()">Save Glucose</button>
    </div>
  </div>

  <div class="card">
    <h3>Add Blood Pressure</h3>
    <div class="grid3">
      <input id="bpSys" placeholder="Systolic (e.g. 120)" />
      <input id="bpDia" placeholder="Diastolic (e.g. 80)" />
      <select id="bpNote">
        <option value="">(Choose note)</option>
        <option>Resting</option>
        <option>After walking</option>
        <option>After exercise</option>
        <option>Before sleep</option>
        <option>After coffee</option>
        <option>Feeling dizzy</option>
      </select>
    </div>
    <button onclick="saveBP()">Save Blood Pressure</button>
  </div>

  <div class="card">
    <h3>My Readings</h3>
    <button onclick="loadAll()">Load My Readings</button>
    <table>
      <thead>
        <tr>
          <th>Date/Time</th>
          <th>Type</th>
          <th>Value</th>
          <th>Note</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>

    <!-- Legend -->
    <div class="legend">
      <div><span class="dot ok"></span> Normal</div>
      <div><span class="dot warn"></span> Elevated / Prediabetes</div>
      <div><span class="dot bad"></span> High</div>
    </div>
  </div>

  <div class="card">
    <h3>Chart</h3>
    <canvas id="chart" height="120"></canvas>
  </div>

<script>
const userId = localStorage.getItem("userId");
if (!userId) location.href = "/index.html";

hello.textContent = "Hello, " + (localStorage.getItem("name") || "");

function logout(){
  localStorage.removeItem("userId");
  localStorage.removeItem("name");
  localStorage.removeItem("email");
  location.href = "/index.html";
}

/* ===== Coloring Helpers ===== */
function glucoseClass(v){
  const n = Number(v);
  if (Number.isNaN(n)) return "";
  if (n < 100) return "glucose-low";
  if (n <= 125) return "glucose-mid";
  return "glucose-high";
}

function bpHtml(v){
  // v مثل "120/80"
  const parts = String(v).split("/");
  const s = Number(parts[0]);
  const d = Number(parts[1]);

  // Systolic
  const sysClass =
    Number.isNaN(s) ? "" :
    s < 120 ? "bp-low" :
    s <= 129 ? "bp-mid" :
    "bp-high";

  // Diastolic
  const diaClass =
    Number.isNaN(d) ? "" :
    d < 80 ? "bp-low" :
    d <= 89 ? "bp-mid" :
    "bp-high";

  if (Number.isNaN(s) || Number.isNaN(d)) return String(v);

  return `<span class="${sysClass}">${s}</span>/<span class="${diaClass}">${d}</span>`;
}

/* ===== Save Readings ===== */
async function saveGlucose(){
  const v = gVal.value.trim();
  if (!v) return alert("Enter glucose value");

  await fetch("/api/readings", {
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      userId,
      type: "glucose",
      value: v,
      note: gNote.value
    })
  });

  gVal.value = "";
  gNote.value = "";
  loadAll();
}

async function saveBP(){
  const s = bpSys.value.trim();
  const d = bpDia.value.trim();
  if (!s || !d) return alert("Enter systolic and diastolic");

  await fetch("/api/readings", {
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      userId,
      type: "bp",
      value: `${s}/${d}`,
      note: bpNote.value
    })
  });

  bpSys.value = "";
  bpDia.value = "";
  bpNote.value = "";
  loadAll();
}

/* ===== Load Table + Chart ===== */
async function loadAll(){
  const res = await fetch(`/api/readings/${userId}`);
  const data = await res.json();

  rows.innerHTML = "";

  for (const r of data.slice().reverse()) {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${new Date(r.ts).toLocaleString()}</td>
      <td>${r.type === "bp" ? "Blood Pressure" : "Glucose"}</td>
      <td>${
        r.type === "glucose"
          ? `<span class="${glucoseClass(r.value)}">${r.value}</span>`
          : bpHtml(r.value)
      }</td>
      <td>${r.note || ""}</td>
    `;

    rows.appendChild(tr);
  }

  await loadChart();
}

let chartObj = null;
async function loadChart(){
  const res = await fetch(`/api/chart/${userId}`);
  const data = await res.json();

  const ctx = document.getElementById("chart");
  if (chartObj) chartObj.destroy();

  chartObj = new Chart(ctx, {
    type: "line",
    data: {
      labels: data.labels,
      datasets: [
        { label: "Glucose Avg", data: data.glucoseAvg },
        { label: "BP Systolic Avg", data: data.sysAvg },
        { label: "BP Diastolic Avg", data: data.diaAvg }
      ]
    }
  });
}

loadAll();
</script>
</body>
</html>
